services:
  opencode-serve:
    image: music_tag_agent:latest
    container_name: music_tag_agent
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          body="$$(wget -q -O - http://127.0.0.1:$${OPENCODE_PORT:-9002}/global/health)" &&
          printf '%s' "$$body" | grep -Eq '"healthy"[[:space:]]*:[[:space:]]*true' &&
          printf '%s' "$$body" | grep -Eq '"version"[[:space:]]*:[[:space:]]*"[^"]+"'
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    ports:
      - "${OPENCODE_PORT:-9002}:${OPENCODE_PORT:-9002}"
    environment:
      OPENCODE_PORT: ${OPENCODE_PORT:-9002}
      OPENCODE_HOSTNAME: ${OPENCODE_HOSTNAME:-0.0.0.0}
      OPENCODE_CORS: ${OPENCODE_CORS:-}
      OPENCODE_MDNS: ${OPENCODE_MDNS:-}
      OPENCODE_MDNS_DOMAIN: ${OPENCODE_MDNS_DOMAIN:-}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      OPENCODE_CONFIG_FILE: ${OPENCODE_CONFIG_FILE:-/home/opencode/.config/opencode/opencode.json}
      OPENCODE_CONFIG_TEMPLATE: ${OPENCODE_CONFIG_TEMPLATE:-compatible}
      OPENCODE_PROVIDER_ID: ${OPENCODE_PROVIDER_ID:-myprovider}
      OPENCODE_PROVIDER_NPM: ${OPENCODE_PROVIDER_NPM:-@ai-sdk/openai-compatible}
      OPENCODE_PROVIDER_NAME: ${OPENCODE_PROVIDER_NAME:-${OPENCODE_PROVIDER_ID:-myprovider}}
      OPENCODE_PROVIDER_BASE_URL: ${OPENCODE_PROVIDER_BASE_URL:-https://api.myprovider.com/v1}
      OPENCODE_PROVIDER_API_KEY: ${OPENCODE_PROVIDER_API_KEY:-}
      OPENCODE_PROVIDER_AUTHORIZATION: ${OPENCODE_PROVIDER_AUTHORIZATION:-}
      OPENCODE_MODEL_ID: ${OPENCODE_MODEL_ID:-my-model-name}
      OPENCODE_MODEL_NAME: ${OPENCODE_MODEL_NAME:-${OPENCODE_MODEL_ID:-my-model-name}}
      OPENCODE_MODEL_CONTEXT: ${OPENCODE_MODEL_CONTEXT:-}
      OPENCODE_MODEL_OUTPUT: ${OPENCODE_MODEL_OUTPUT:-}
      MCP_URL: ${MCP_URL:-http://music-tag:8002/mcp/}
      MCP_ACCESS_TOKEN: ${MCP_ACCESS_TOKEN:-}
    # 如果使用 OPENCODE_CONFIG_TEMPLATE=compatible，可以不挂载 opencode.json。
    # volumes:
    #  - /Users/macbookair/coding/compose/ai_story_config/opencode_mtw.json:/home/opencode/.config/opencode/opencode.json
    #  - /Users/macbookair/coding/music_tag_agent:/home/opencode/app
