旅程对象:
  名称: 系统个性化设置使用指引
  说明: 帮助用户调整语言、站点标题、主题和背景风格

页面对象:
  - 系统设置页
  - 个性化设置区

表单对象:
  个性化表单:
    - 字段名: 语言
      是否必填: 建议必填
      输入类型: 单选
      格式要求:
        - 从系统提供的语言中选择
      错误提示:
        - 无
    - 字段名: 站点标题
      是否必填: 选填
      输入类型: 文本
      格式要求:
        - 建议填写简洁清晰的站点名称
      错误提示:
        - 标题过长时，页面显示效果可能受影响
    - 字段名: 是否显示角色标识
      是否必填: 选填
      输入类型: 开关
      格式要求:
        - 开启后会在界面中显示角色相关标识
      错误提示:
        - 无
    - 字段名: 主题
      是否必填: 建议必填
      输入类型: 单选
      格式要求:
        - 从系统提供的主题中选择一种界面风格
      错误提示:
        - 无
    - 字段名: 是否隐藏背景
      是否必填: 选填
      输入类型: 开关
      格式要求:
        - 开启后会隐藏自定义背景效果
      错误提示:
        - 无
    - 字段名: 自定义背景图片
      是否必填: 选填
      输入类型: 图片
      格式要求:
        - 建议上传可正常显示的背景图片
      错误提示:
        - 图片无法识别时，上传会失败

操作步骤对象:
  - 步骤名称: 切换语言
    用户动作: 选择界面语言
    填写项:
      - 语言
    系统反馈: 页面语言立即更新
    后续动作: 继续调整外观

  - 步骤名称: 修改站点标题
    用户动作: 输入新的站点标题并决定是否显示角色标识
    填写项:
      - 站点标题
      - 是否显示角色标识
    系统反馈: 标题与角色展示方式更新
    后续动作: 继续选择主题

  - 步骤名称: 调整主题与背景
    用户动作: 选择主题，或上传、清除背景图片
    填写项:
      - 主题
      - 是否隐藏背景
      - 自定义背景图片
    系统反馈: 界面样式即时变化
    后续动作: 保存并使用新的视觉风格

反馈对象:
  - 语言切换成功
  - 上传成功
  - 恢复成功
  - 主题已切换

结果对象:
  - 个性化界面样式
  - 已保存的站点标题
  - 已设置的背景效果

错误场景对象:
  - 场景名称: 站点标题过长
    触发条件: 输入了过长的站点标题
    用户可见提示:
      - 标题过长时，页面显示效果可能受影响
    用户应对动作:
      - 改为更简洁的站点标题
    可前往页面:
      - 个性化设置区
  - 场景名称: 背景图片无法识别
    触发条件: 上传了系统无法识别或无法显示的背景图片
    用户可见提示:
      - 图片无法识别时，上传会失败
    用户应对动作:
      - 更换为可正常显示的图片后重新上传
    可前往页面:
      - 个性化设置区

检索关键词:
  - 个性化
  - 语言
  - 站点标题
  - 主题
  - 背景
