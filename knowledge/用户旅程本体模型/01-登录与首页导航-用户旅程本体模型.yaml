旅程对象:
  名称: 登录与首页导航使用指引
  说明: 帮助用户完成登录并理解系统主要入口

页面对象:
  - 登录页
  - 首页
  - 操作台
  - 操作记录页
  - 音乐收藏馆
  - 系统设置页

操作步骤对象:
  - 步骤名称: 进入登录页
    用户动作: 打开系统登录入口
    系统反馈: 显示账号登录界面
    后续动作: 输入账号信息

  - 步骤名称: 登录系统
    用户动作: 输入账号信息并提交
    系统反馈: 登录成功后进入首页或默认入口页
    后续动作: 选择要进入的功能区域

  - 步骤名称: 识别首页入口
    用户动作: 查看顶部或侧边导航
    系统反馈:
      - 可见首页
      - 可见操作台
      - 可见操作记录
      - 可见音乐收藏馆
      - 可见系统设置
    后续动作: 按目标进入相应旅程

反馈对象:
  - 登录成功
  - 访问受限
  - 请先登录

结果对象:
  - 已进入系统
  - 已定位到目标功能入口

检索关键词:
  - 登录
  - 首页
  - 导航
  - 入口
  - 去哪里开始

