旅程对象:
  名称: 插件管理与扩展能力使用指引
  说明: 帮助管理员查看、启用、停用和配置插件能力

页面对象:
  - 插件管理页
  - 插件列表区域
  - 插件配置区域
  - 插件开发工具区域

表单对象:
  插件配置表单:
    - 字段名: 插件名称
      是否必填: 建议必填
      输入类型: 文本
      格式要求:
        - 建议填写便于识别的插件名称
      错误提示:
        - 无
    - 字段名: 插件描述
      是否必填: 选填
      输入类型: 长文本
      格式要求:
        - 可简要说明插件用途和适用场景
      错误提示:
        - 无
    - 字段名: 插件类型
      是否必填: 建议必填
      输入类型: 单选
      格式要求:
        - 从系统支持的插件类型中选择
      错误提示:
        - 未选择插件类型时，系统可能无法正确识别用途
    - 字段名: 运行配置项
      是否必填: 选填
      输入类型: 长文本
      格式要求:
        - 按插件说明填写所需配置内容
      错误提示:
        - 配置不完整时，插件测试或运行可能失败
    - 字段名: 插件脚本文件
      是否必填: 条件必填
      输入类型: 文件
      格式要求:
        - 在脚本上传场景下填写
        - 仅支持 .py 文件
        - 文件大小建议不超过 2MB
      错误提示:
        - 文件类型不正确时，无法上传插件脚本
        - 文件过大时，上传会失败
    - 字段名: 插件安装包
      是否必填: 条件必填
      输入类型: 文件
      格式要求:
        - 在安装包上传场景下填写
        - 仅支持 ZIP 压缩包
        - 文件大小建议不超过 10MB
      错误提示:
        - 文件类型不正确时，无法上传插件包
        - 文件过大时，上传会失败
    - 字段名: 插件标识
      是否必填: 条件必填
      输入类型: 文本
      格式要求:
        - 仅在创建或导入插件定义时填写
        - 仅支持字母、数字、下划线和横线
      错误提示:
        - 标识格式不正确时，插件无法保存

操作步骤对象:
  - 步骤名称: 进入插件管理页
    用户动作: 从导航进入插件管理
    系统反馈: 显示插件列表与状态
    后续动作: 查看或配置插件

  - 步骤名称: 查看插件能力
    用户动作: 浏览可用插件
    系统反馈: 显示插件名称、用途和当前状态
    后续动作: 选择启用、停用或配置

  - 步骤名称: 配置插件
    用户动作: 填写插件运行信息
    填写项:
      - 插件名称
      - 插件描述
      - 插件类型
      - 运行配置项
    系统反馈: 保存成功后插件可在相关功能中使用
    后续动作: 回到自动刮削或批量处理场景选择该能力

反馈对象:
  - 加载插件列表中
  - 插件测试成功
  - 插件测试失败
  - 更新成功

结果对象:
  - 插件配置结果
  - 可用标签来源
  - 可用批量处理能力

错误场景对象:
  - 场景名称: 插件脚本文件类型错误
    触发条件: 上传插件脚本时，选择了非 .py 文件
    用户可见提示:
      - 文件类型不正确时，无法上传插件脚本
    用户应对动作:
      - 改为上传 .py 格式的插件脚本
    可前往页面:
      - 插件开发工具区域
  - 场景名称: 插件脚本文件过大
    触发条件: 上传的插件脚本超过前台允许大小
    用户可见提示:
      - 文件过大时，上传会失败
    用户应对动作:
      - 压缩或精简插件脚本内容
      - 将脚本文件控制在 2MB 以内
    可前往页面:
      - 插件开发工具区域
  - 场景名称: 插件安装包类型错误
    触发条件: 上传插件安装包时，选择了非 ZIP 文件
    用户可见提示:
      - 文件类型不正确时，无法上传插件包
    用户应对动作:
      - 改为上传 ZIP 压缩包
    可前往页面:
      - 插件管理页
  - 场景名称: 插件标识格式不正确
    触发条件: 创建或导入插件时，插件标识包含了不支持的字符
    用户可见提示:
      - 标识格式不正确时，插件无法保存
    用户应对动作:
      - 改为只使用字母、数字、下划线和横线
    可前往页面:
      - 插件配置区域
  - 场景名称: 插件配置不完整
    触发条件: 已保存插件，但运行配置项缺失或不完整
    用户可见提示:
      - 配置不完整时，插件测试或运行可能失败
    用户应对动作:
      - 按插件说明补全运行配置项
      - 保存后重新测试插件
    可前往页面:
      - 插件配置区域

检索关键词:
  - 插件管理
  - 标签来源
  - 扩展能力
  - 插件配置
  - 插件开发工具
