旅程对象:
  名称: 专辑详情编辑收藏与删除使用指引
  说明: 帮助用户在专辑详情页完成浏览、收藏、编辑和删除操作

页面对象:
  - 专辑详情页
  - 编辑专辑信息面板
  - 删除专辑确认面板

表单对象:
  专辑编辑表单:
    - 字段名: 专辑名称
      是否必填: 建议必填
      输入类型: 文本
      格式要求:
        - 建议填写清晰可识别的专辑名称
      错误提示:
        - 无
    - 字段名: 专辑封面
      是否必填: 选填
      输入类型: 图片
      格式要求:
        - 仅支持 JPG、PNG、GIF
        - 图片大小不超过 5MB
      错误提示:
        - 图片格式不支持时，无法上传封面
        - 图片过大时，无法上传封面
    - 字段名: 专辑描述
      是否必填: 选填
      输入类型: 长文本
      格式要求:
        - 可填写专辑简介或补充说明
      错误提示:
        - 无

操作步骤对象:
  - 步骤名称: 浏览专辑详情
    用户动作: 打开某个专辑
    系统反馈: 展示专辑名称、艺术家、年份、歌曲数、时长和曲目列表
    后续动作: 播放、收藏或编辑

  - 步骤名称: 收藏专辑
    用户动作: 点击收藏按钮
    系统反馈: 专辑进入或移出收藏状态
    后续动作: 在收藏筛选中查看

  - 步骤名称: 编辑专辑信息
    用户动作: 打开编辑专辑信息面板
    填写项:
      - 专辑名称
      - 专辑封面
      - 专辑描述
    系统反馈: 可预览封面并保存修改
    后续动作: 选择仅保存，或保存并更新音乐元数据

  - 步骤名称: 删除专辑
    用户动作: 打开删除确认并提交
    系统反馈: 从音乐收藏中删除此专辑，但不会删除源文件
    后续动作: 返回专辑列表

反馈对象:
  - 编辑专辑信息
  - 保存
  - 保存并更新音乐元数据
  - 删除专辑

结果对象:
  - 已更新的专辑信息
  - 收藏状态变化
  - 删除后的收藏结果

错误场景对象:
  - 场景名称: 专辑封面格式不支持
    触发条件: 上传了系统不支持的专辑封面图片
    用户可见提示:
      - 图片格式不支持时，无法上传封面
    用户应对动作:
      - 改为上传 JPG、PNG 或 GIF 图片
    可前往页面:
      - 编辑专辑信息面板
  - 场景名称: 专辑封面超过大小限制
    触发条件: 上传的专辑封面大于 5MB
    用户可见提示:
      - 图片过大时，无法上传封面
    用户应对动作:
      - 压缩图片后重新上传
      - 将图片大小控制在 5MB 以内
    可前往页面:
      - 编辑专辑信息面板

检索关键词:
  - 专辑详情
  - 编辑专辑
  - 专辑封面
  - 删除专辑
  - 收藏专辑
