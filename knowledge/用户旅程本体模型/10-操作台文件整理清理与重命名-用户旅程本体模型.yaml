旅程对象:
  名称: 操作台文件整理清理与重命名使用指引
  说明: 帮助用户整理目录结构、重命名文件并清理无效文件夹

页面对象:
  - 操作台
  - 批量处理面板
  - 文件操作面板
  - 删除文件夹确认面板

表单对象:
  文件整理表单:
    - 字段名: 整理后的根目录
      是否必填: 建议必填
      输入类型: 路径
      格式要求:
        - 建议填写系统可访问的目标根目录
      错误提示:
        - 目录不可用时，整理任务可能失败
    - 字段名: 目录层级设置
      是否必填: 建议必填
      输入类型: 多选
      格式要求:
        - 按系统提供的目录层级规则选择整理方式
      错误提示:
        - 未选择层级规则时，整理结果可能不符合预期
    - 字段名: 是否启用音乐洗版
      是否必填: 选填
      输入类型: 开关
      格式要求:
        - 开启后会按洗版规则进一步清理文件名或目录名
      错误提示:
        - 无
    - 字段名: 洗版规则
      是否必填: 条件必填
      输入类型: 多选
      格式要求:
        - 仅在启用音乐洗版时需要选择规则
      错误提示:
        - 已开启音乐洗版但未选择规则时，处理结果可能不明确
  文件清理表单:
    - 字段名: 删除模式
      是否必填: 必填
      输入类型: 单选
      格式要求:
        - 从系统提供的删除方式中选择一种
      错误提示:
        - 未选择删除方式时，无法继续执行清理
    - 字段名: 是否删除空文件夹
      是否必填: 选填
      输入类型: 开关
      格式要求:
        - 开启后会删除没有任何内容的文件夹
      错误提示:
        - 无
    - 字段名: 是否删除无音乐文件夹
      是否必填: 选填
      输入类型: 开关
      格式要求:
        - 开启后会删除不包含音乐文件的文件夹
      错误提示:
        - 无

操作步骤对象:
  - 步骤名称: 选择待整理对象
    用户动作: 在操作台中勾选文件夹或歌曲
    系统反馈: 已勾选内容进入文件操作范围
    后续动作: 打开文件操作面板

  - 步骤名称: 配置目录整理规则
    用户动作: 设置整理后的根目录和目录层级
    填写项:
      - 整理后的根目录
      - 目录层级设置
      - 是否启用音乐洗版
      - 洗版规则
    系统反馈: 显示目录整理规则
    后续动作: 执行整理

  - 步骤名称: 执行文件重命名或整理
    用户动作: 提交整理与重命名操作
    系统反馈: 创建处理任务并进入后台执行
    后续动作: 前往操作记录页查看结果

  - 步骤名称: 删除无效文件夹
    用户动作: 打开删除文件夹面板并选择清理模式
    填写项:
      - 删除模式
      - 是否删除空文件夹
      - 是否删除无音乐文件夹
    系统反馈: 提示此操作会删除选中的文件夹
    后续动作: 确认删除并查看结果

反馈对象:
  - 删除文件夹
  - 删除空文件夹
  - 删除无音乐文件夹
  - 创建成功，任务正在处理中
  - 请谨慎确认删除范围

结果对象:
  - 已整理的目录结构
  - 已重命名的文件
  - 已删除的无效文件夹
  - 整理日志

错误场景对象:
  - 场景名称: 整理根目录不可用
    触发条件: 填写了不存在或系统无法访问的整理目标目录
    用户可见提示:
      - 目录不可用时，整理任务可能失败
    用户应对动作:
      - 改为填写系统可访问的目标根目录
    可前往页面:
      - 文件操作面板
  - 场景名称: 未选择目录层级规则
    触发条件: 开始整理前，没有选择目录层级设置
    用户可见提示:
      - 未选择层级规则时，整理结果可能不符合预期
    用户应对动作:
      - 先选择目录层级规则，再执行整理
    可前往页面:
      - 文件操作面板
  - 场景名称: 已开启音乐洗版但未选择规则
    触发条件: 打开音乐洗版开关后，没有勾选任何洗版规则
    用户可见提示:
      - 已开启音乐洗版但未选择规则时，处理结果可能不明确
    用户应对动作:
      - 选择至少一项洗版规则，或关闭音乐洗版
    可前往页面:
      - 文件操作面板
  - 场景名称: 未选择删除方式
    触发条件: 进入删除文件夹流程，但没有选择清理模式
    用户可见提示:
      - 未选择删除方式时，无法继续执行清理
    用户应对动作:
      - 先选择删除模式，再确认删除
    可前往页面:
      - 删除文件夹确认面板

检索关键词:
  - 整理目录
  - 重命名文件
  - 删除文件夹
  - 洗版
  - 目录层级
