旅程对象:
  名称: 系统角色权限管理使用指引
  说明: 帮助管理员为成员分配合适的访问与管理角色

页面对象:
  - 系统设置页
  - 权限管理区

表单对象:
  角色分配表单:
    - 字段名: 成员名称
      是否必填: 必填
      输入类型: 单选
      格式要求:
        - 需从现有成员中选择一个目标成员
      错误提示:
        - 未选择成员时，无法分配角色
    - 字段名: 角色类型
      是否必填: 必填
      输入类型: 单选
      格式要求:
        - 需从系统支持的角色类型中选择
      错误提示:
        - 未选择角色类型时，无法完成角色分配

操作步骤对象:
  - 步骤名称: 进入权限管理
    用户动作: 打开系统设置中的权限管理
    系统反馈: 显示当前成员与角色说明
    后续动作: 选择要调整的成员

  - 步骤名称: 分配角色
    用户动作: 将成员分配为收藏家或听众
    填写项:
      - 成员名称
      - 角色类型
    系统反馈: 成员角色实时更新
    后续动作: 继续邀请或调整其他成员

  - 步骤名称: 邀请或移除角色
    用户动作: 招募收藏家、招募听众，或移除已有权限
    系统反馈: 提示加入、离开或晋升结果
    后续动作: 完成权限治理

反馈对象:
  - 权限管理
  - 招募收藏家
  - 招募听众
  - 更新成功

结果对象:
  - 成员角色分配结果
  - 权限结构

错误场景对象:
  - 场景名称: 未选择成员
    触发条件: 分配角色时，没有选择目标成员
    用户可见提示:
      - 未选择成员时，无法分配角色
    用户应对动作:
      - 先选择要调整权限的成员
    可前往页面:
      - 权限管理区
  - 场景名称: 未选择角色类型
    触发条件: 已选择成员，但没有选择角色类型
    用户可见提示:
      - 未选择角色类型时，无法完成角色分配
    用户应对动作:
      - 选择合适的角色类型后重新保存
    可前往页面:
      - 权限管理区

检索关键词:
  - 权限管理
  - 角色
  - 收藏家
  - 听众
  - 成员邀请
