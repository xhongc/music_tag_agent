旅程对象:
  名称: 播放列表库创建导入与智能规则使用指引
  说明: 帮助用户在播放列表库中创建歌单、导入歌单和配置智能规则

页面对象:
  - 播放列表页
  - 创建智能播放列表面板
  - 导入播放列表面板

表单对象:
  播放列表库表单:
    - 字段名: 播放列表名称
      是否必填: 必填
      输入类型: 文本
      格式要求:
        - 名称不能为空
      错误提示:
        - 播放列表名称不能为空
    - 字段名: 智能规则条件
      是否必填: 条件必填
      输入类型: 长文本
      格式要求:
        - 创建智能播放列表时必须填写规则条件
      错误提示:
        - 规则条件不完整时，无法生成智能播放列表
    - 字段名: 最多保留条数
      是否必填: 选填
      输入类型: 数字
      格式要求:
        - 必须填写数字
        - 建议填写大于 0 的整数
      错误提示:
        - 条数格式不正确时，无法正常保存规则
    - 字段名: 是否动态更新
      是否必填: 选填
      输入类型: 开关
      格式要求:
        - 开启后会按规则自动刷新歌单内容
      错误提示:
        - 无
    - 字段名: 导入文件
      是否必填: 条件必填
      输入类型: 文件
      格式要求:
        - 导入歌单时必须上传文件
        - 建议使用 m3u8 播放列表文件
      错误提示:
        - 未上传文件时，无法执行导入
        - 文件格式不支持时，导入会失败
    - 字段名: 是否替换歌曲路径前缀
      是否必填: 选填
      输入类型: 开关
      格式要求:
        - 开启后会按填写的路径前缀进行替换
      错误提示:
        - 无
    - 字段名: 原始路径前缀
      是否必填: 条件必填
      输入类型: 文本
      格式要求:
        - 仅在开启路径前缀替换时需要填写
        - 应填写需要被替换的原始路径前缀
      错误提示:
        - 已开启路径替换但未填写原始路径前缀时，导入结果可能异常

操作步骤对象:
  - 步骤名称: 创建智能播放列表
    用户动作: 打开智能歌单面板并填写名称与规则
    填写项:
      - 播放列表名称
      - 智能规则条件
      - 最多保留条数
      - 是否动态更新
    系统反馈: 生成新的智能播放列表
    后续动作: 进入详情页查看内容

  - 步骤名称: 导入播放列表文件
    用户动作: 选择导入文件并决定是否替换路径前缀
    填写项:
      - 导入文件
      - 是否替换歌曲路径前缀
      - 原始路径前缀
    系统反馈: 系统解析文件并创建新的播放列表
    后续动作: 打开导入后的歌单

  - 步骤名称: 浏览播放列表库
    用户动作: 在最近添加和排序视图之间切换
    系统反馈: 显示播放列表封面、名称和歌曲数量
    后续动作: 进入某个播放列表详情页

反馈对象:
  - 创建智能播放列表
  - 导入播放列表
  - 保存
  - 动态更新

结果对象:
  - 新创建的智能播放列表
  - 导入后的播放列表
  - 规则化播放列表集合

错误场景对象:
  - 场景名称: 播放列表名称为空
    触发条件: 创建智能播放列表或导入歌单时，没有填写名称
    用户可见提示:
      - 播放列表名称不能为空
    用户应对动作:
      - 填写歌单名称后重新提交
    可前往页面:
      - 创建智能播放列表面板
      - 导入播放列表面板
  - 场景名称: 智能规则条件不完整
    触发条件: 创建智能播放列表时，没有填写完整的规则条件
    用户可见提示:
      - 规则条件不完整时，无法生成智能播放列表
    用户应对动作:
      - 补全规则条件后重新保存
    可前往页面:
      - 创建智能播放列表面板
  - 场景名称: 最多保留条数不是数字
    触发条件: 在最多保留条数字段中输入了非数字内容
    用户可见提示:
      - 条数格式不正确时，无法正常保存规则
    用户应对动作:
      - 改为填写数字
      - 建议填写大于 0 的整数
    可前往页面:
      - 创建智能播放列表面板
  - 场景名称: 导入文件未上传
    触发条件: 进入导入歌单流程，但没有上传任何文件
    用户可见提示:
      - 未上传文件时，无法执行导入
    用户应对动作:
      - 先上传一个可用的播放列表文件，再重新导入
    可前往页面:
      - 导入播放列表面板
  - 场景名称: 原始路径前缀未填写
    触发条件: 已开启路径前缀替换，但没有填写原始路径前缀
    用户可见提示:
      - 已开启路径替换但未填写原始路径前缀时，导入结果可能异常
    用户应对动作:
      - 填写需要被替换的原始路径前缀
    可前往页面:
      - 导入播放列表面板

检索关键词:
  - 播放列表库
  - 智能歌单
  - 导入歌单
  - 动态更新
  - 播放列表规则
