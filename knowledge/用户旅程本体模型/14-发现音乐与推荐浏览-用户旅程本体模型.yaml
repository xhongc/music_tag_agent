旅程对象:
  名称: 发现音乐与推荐浏览使用指引
  说明: 帮助用户在系统中浏览热门歌曲、推荐专辑与最新发布内容

页面对象:
  - 发现音乐页
  - 热门推荐区域
  - 热门艺术家区域
  - 推荐专辑区域
  - 最新发布区域
  - 精选专辑区域

操作步骤对象:
  - 步骤名称: 进入发现音乐页
    用户动作: 从音乐收藏馆进入发现音乐
    系统反馈: 展示热门歌曲、热门艺术家和推荐内容
    后续动作: 选择感兴趣的内容

  - 步骤名称: 查看热门推荐
    用户动作: 浏览热门歌曲和热门艺术家
    系统反馈: 显示播放热度、专辑和艺术家信息
    后续动作: 进入专辑、艺术家详情或直接播放

  - 步骤名称: 浏览推荐专辑与最新发布
    用户动作: 查看推荐专辑、精选专辑和最新发布
    系统反馈: 显示封面、年份、简介与播放入口
    后续动作: 立即播放或进入专辑详情

反馈对象:
  - 发现音乐
  - 热门推荐
  - 推荐专辑
  - 最新发布
  - 精选专辑

结果对象:
  - 热门推荐列表
  - 推荐专辑列表
  - 最新发布列表

检索关键词:
  - 发现音乐
  - 热门推荐
  - 推荐专辑
  - 最新发布
  - 精选专辑

