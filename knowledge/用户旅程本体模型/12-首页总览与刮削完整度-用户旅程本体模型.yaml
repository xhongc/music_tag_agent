旅程对象:
  名称: 首页总览与刮削完整度使用指引
  说明: 帮助用户从首页快速了解收藏规模、任务状态与待补全内容

页面对象:
  - 首页
  - 刮削完整度页
  - 缺失项列表区域

操作步骤对象:
  - 步骤名称: 查看首页总览
    用户动作: 进入首页
    系统反馈:
      - 展示全部歌曲
      - 展示全部专辑
      - 展示全部艺术家
      - 展示歌曲时长
      - 展示刮削完整度
    后续动作: 进入对应详情页面

  - 步骤名称: 打开刮削完整度页
    用户动作: 点击完整度入口
    系统反馈: 展示缺失歌词、缺失封面、缺失专辑、缺失艺术家、缺失流派、缺失年份
    后续动作: 选择某个缺失项处理

  - 步骤名称: 对缺失项发起补全
    用户动作: 在缺失列表中点击“自动刮削”
    系统反馈: 创建对应补全任务
    后续动作: 前往操作记录页查看结果

反馈对象:
  - 刮削完整度
  - 剩余任务
  - 缺失歌词
  - 缺失封面
  - 缺失专辑

结果对象:
  - 首页统计总览
  - 缺失项清单
  - 对应补全任务

检索关键词:
  - 首页
  - 刮削完整度
  - 缺失歌词
  - 缺失封面
  - 统计总览

