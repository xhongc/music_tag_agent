旅程对象:
  名称: 系统后台任务与数据维护使用指引
  说明: 帮助管理员执行定时任务、清理冗余数据和维护音乐收藏

页面对象:
  - 系统设置页
  - 后台任务管理区
  - 删除管理区

表单对象:
  后台任务表单:
    - 字段名: 执行方式
      是否必填: 必填
      输入类型: 单选
      格式要求:
        - 从手动执行、定时执行或周期执行中选择一种方式
      错误提示:
        - 未选择执行方式时，无法保存任务配置
    - 字段名: 执行周期
      是否必填: 条件必填
      输入类型: 文本
      格式要求:
        - 仅在周期执行时需要填写
        - 必须是由 5 段组成的执行周期表达式
      错误提示:
        - 执行周期不能为空
        - 执行周期格式错误，应为5个字段
    - 字段名: 是否启用任务
      是否必填: 选填
      输入类型: 开关
      格式要求:
        - 开启后任务才会进入可执行状态
      错误提示:
        - 无

操作步骤对象:
  - 步骤名称: 选择后台任务
    用户动作: 在后台任务管理区选择目标任务
    系统反馈: 显示任务用途、状态和上次执行时间
    后续动作: 配置执行方式

  - 步骤名称: 配置执行方式
    用户动作: 选择手动执行、定时执行或周期执行
    填写项:
      - 执行方式
      - 执行周期
      - 是否启用任务
    系统反馈: 任务配置更新成功
    后续动作: 立即执行或等待系统调度

  - 步骤名称: 执行维护任务
    用户动作: 执行停止后台任务、刮削艺术家封面、合并相似艺术家或清理数据
    系统反馈:
      - 显示执行中
      - 显示运行中或已关闭
      - 提示去日志中查看结果
    后续动作: 前往操作记录页确认结果

反馈对象:
  - 后台任务管理
  - 执行中
  - 运行中
  - 已关闭
  - 上次执行时间

结果对象:
  - 后台任务状态
  - 数据维护结果
  - 艺术家封面更新结果
  - 清理结果

错误场景对象:
  - 场景名称: 未选择执行方式
    触发条件: 配置后台任务时，没有选择执行方式就直接保存
    用户可见提示:
      - 未选择执行方式时，无法保存任务配置
    用户应对动作:
      - 先选择手动执行、定时执行或周期执行中的一种
    可前往页面:
      - 后台任务管理区
  - 场景名称: 执行周期为空
    触发条件: 已选择周期执行，但没有填写执行周期
    用户可见提示:
      - 执行周期不能为空
    用户应对动作:
      - 补充执行周期后重新保存
    可前往页面:
      - 后台任务管理区
  - 场景名称: 执行周期格式错误
    触发条件: 已填写执行周期，但不是 5 段表达式
    用户可见提示:
      - 执行周期格式错误，应为5个字段
    用户应对动作:
      - 按 5 段格式重新填写执行周期
    可前往页面:
      - 后台任务管理区

检索关键词:
  - 后台任务
  - 数据维护
  - 停止后台任务
  - 刮削艺术家封面
  - 合并相似艺术家
