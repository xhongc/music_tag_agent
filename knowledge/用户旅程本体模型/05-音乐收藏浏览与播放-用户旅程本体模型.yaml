旅程对象:
  名称: 音乐收藏浏览与播放使用指引
  说明: 帮助用户浏览专辑、艺术家、歌曲并进入播放流程

页面对象:
  - 音乐收藏馆
  - 专辑收藏页
  - 歌曲收藏页
  - 艺术家列表页
  - 专辑详情页
  - 艺术家详情页
  - 发现音乐页
  - 正在播放页
  - 播放设备选择页

操作步骤对象:
  - 步骤名称: 进入音乐收藏馆
    用户动作: 从导航进入音乐收藏馆
    系统反馈: 可按专辑、歌曲、艺术家、风格和发现音乐浏览
    后续动作: 选择浏览方式

  - 步骤名称: 浏览收藏内容
    用户动作: 选择专辑、歌曲、艺术家或风格分类
    系统反馈: 显示对应列表
    后续动作: 进入详情页或直接播放

  - 步骤名称: 查看详情
    用户动作: 打开专辑详情页或艺术家详情页
    系统反馈: 展示关联歌曲、封面和相关信息
    后续动作: 播放或加入播放列表

  - 步骤名称: 进入播放页面
    用户动作: 打开正在播放页
    系统反馈: 显示当前播放队列与设备入口
    后续动作: 切换设备或管理播放队列

反馈对象:
  - 暂无专辑
  - 暂无艺术家
  - 加载专辑数据失败
  - 已切换到播放页面

结果对象:
  - 音乐收藏结果
  - 专辑详情
  - 艺术家详情
  - 当前播放队列

检索关键词:
  - 音乐收藏馆
  - 专辑
  - 艺术家
  - 歌曲
  - 播放
  - 正在播放

