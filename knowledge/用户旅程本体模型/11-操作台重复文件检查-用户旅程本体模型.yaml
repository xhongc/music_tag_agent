旅程对象:
  名称: 操作台重复文件检查使用指引
  说明: 帮助用户发现疑似重复音乐文件并判断处理方向

页面对象:
  - 操作台
  - 批量处理面板
  - 重复文件检查面板
  - 操作记录页
  - 重复详情页

表单对象:
  重复检查表单:
    - 字段名: 检查范围
      是否必填: 必填
      输入类型: 多选
      格式要求:
        - 需要先勾选要检查的歌曲或文件夹
      错误提示:
        - 未选择内容时，无法开始重复检查
    - 字段名: 是否启用声纹重复校验
      是否必填: 选填
      输入类型: 开关
      格式要求:
        - 开启后会增加音频相似度维度的重复检测
      错误提示:
        - 无
    - 字段名: 是否基于音乐收藏识别重复
      是否必填: 选填
      输入类型: 开关
      格式要求:
        - 开启后会结合收藏中的元数据识别重复项
      错误提示:
        - 无

操作步骤对象:
  - 步骤名称: 选择检查范围
    用户动作: 在操作台中勾选歌曲或文件夹
    系统反馈: 已勾选内容进入检查范围
    后续动作: 打开重复文件检查

  - 步骤名称: 配置重复检查规则
    用户动作: 选择是否启用声纹校验与元数据识别
    填写项:
      - 检查范围
      - 是否启用声纹重复校验
      - 是否基于音乐收藏识别重复
    系统反馈: 显示检测方式说明
    后续动作: 提交检查任务

  - 步骤名称: 查看重复检查结果
    用户动作: 在操作记录页或重复详情页查看结果
    系统反馈:
      - 文件哈希重复
      - 文件名称重复
      - 声纹重复
      - 元数据重复
    后续动作: 回到操作台或收藏馆决定保留与清理方式

反馈对象:
  - 重复文件检查
  - 重复检测
  - 系统只会检测重复文件，不会自动删除任何内容
  - 任务正在处理中

结果对象:
  - 重复文件分组
  - 重复原因分类
  - 检查日志

错误场景对象:
  - 场景名称: 未选择检查范围
    触发条件: 没有勾选歌曲或文件夹，就直接开始重复检查
    用户可见提示:
      - 未选择内容时，无法开始重复检查
    用户应对动作:
      - 先勾选要检查的歌曲或文件夹，再重新发起检测
    可前往页面:
      - 重复文件检查面板
  - 场景名称: 误以为系统会自动删除重复文件
    触发条件: 用户完成重复检查后，希望系统直接清理重复文件
    用户可见提示:
      - 系统只会检测重复文件，不会自动删除任何内容
    用户应对动作:
      - 根据重复结果自行决定保留或清理方式
    可前往页面:
      - 重复详情页

检索关键词:
  - 重复文件
  - 重复检查
  - 声纹重复
  - 文件哈希重复
  - 元数据重复
