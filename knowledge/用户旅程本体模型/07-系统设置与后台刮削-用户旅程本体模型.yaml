旅程对象:
  名称: 系统设置与后台刮削使用指引
  说明: 帮助用户配置自动监控目录与后台处理规则

页面对象:
  - 系统设置页
  - 后台刮削设置区
  - 自动刮削配置区
  - 目录整理配置区
  - 执行周期配置区

表单对象:
  后台刮削表单:
    - 字段名: 是否开启后台刮削
      是否必填: 选填
      输入类型: 开关
      格式要求:
        - 开启后系统才会持续监控新进入目录的音乐内容
      错误提示:
        - 无
    - 字段名: 监控目录
      是否必填: 条件必填
      输入类型: 路径
      格式要求:
        - 开启后台刮削后必须填写监控目录
        - 建议填写系统可持续访问的音乐下载或归档目录
      错误提示:
        - 未填写监控目录时，系统无法开始监控
    - 字段名: 标签来源
      是否必填: 建议必填
      输入类型: 多选
      格式要求:
        - 建议至少选择一个标签来源，供自动匹配使用
      错误提示:
        - 未选择标签来源时，自动补全效果可能不完整
    - 字段名: 需要补全的内容
      是否必填: 建议必填
      输入类型: 多选
      格式要求:
        - 建议至少勾选一项需要自动补全的内容
      错误提示:
        - 未勾选补全内容时，自动处理范围可能不明确
    - 字段名: 是否将同目录视为同一专辑
      是否必填: 选填
      输入类型: 开关
      格式要求:
        - 开启后会按目录维度聚合同专辑歌曲
      错误提示:
        - 无
    - 字段名: 整理后的保存位置
      是否必填: 选填
      输入类型: 路径
      格式要求:
        - 如需自动整理文件，可填写整理后的保存目录
      错误提示:
        - 目录不可用时，整理任务可能失败
    - 字段名: 执行周期
      是否必填: 条件必填
      输入类型: 文本
      格式要求:
        - 使用周期执行时必须填写
        - 必须是由 5 段组成的执行周期表达式
      错误提示:
        - 请输入有效的执行周期
        - 至少保留一套配置

操作步骤对象:
  - 步骤名称: 进入系统设置
    用户动作: 从导航进入系统设置页
    系统反馈: 可见后台刮削相关配置区域
    后续动作: 开启后台处理

  - 步骤名称: 开启后台刮削
    用户动作: 打开后台刮削开关
    填写项:
      - 是否开启后台刮削
      - 监控目录
    系统反馈: 系统开始监控新进入目录的音乐文件
    后续动作: 设置自动处理规则

  - 步骤名称: 配置自动处理规则
    用户动作: 设置标签来源、补全内容和目录整理方式
    填写项:
      - 标签来源
      - 需要补全的内容
      - 是否将同目录视为同一专辑
      - 整理后的保存位置
    系统反馈: 规则保存成功
    后续动作: 配置执行周期

  - 步骤名称: 设置执行周期
    用户动作: 填写后台处理周期
    填写项:
      - 执行周期
    系统反馈:
      - 表达式有效时提示更新成功
      - 表达式错误时提示请输入有效的执行周期
    后续动作: 前往操作记录页查看结果

反馈对象:
  - 更新成功
  - 更新失败
  - 至少保留一套配置
  - 请输入有效的执行周期

结果对象:
  - 后台刮削任务
  - 自动处理规则
  - 处理进度
  - 处理结果

错误场景对象:
  - 场景名称: 未填写监控目录
    触发条件: 开启后台刮削后，没有填写监控目录就尝试保存
    用户可见提示:
      - 未填写监控目录时，系统无法开始监控
    用户应对动作:
      - 填写系统可以持续访问的监控目录
      - 确认目录中确实会产生待处理的音乐文件
    可前往页面:
      - 系统设置页
  - 场景名称: 执行周期格式错误
    触发条件: 使用周期执行时，填写的执行周期不是 5 段表达式
    用户可见提示:
      - 请输入有效的执行周期
    用户应对动作:
      - 按 5 段格式重新填写执行周期
      - 保存前先检查每一段是否完整
    可前往页面:
      - 执行周期配置区
  - 场景名称: 配置被清空导致无法保存
    触发条件: 用户删除了当前唯一有效的一套自动处理配置
    用户可见提示:
      - 至少保留一套配置
    用户应对动作:
      - 至少保留一套有效的自动处理规则
      - 如需调整，请先新增或修改后再删除旧配置
    可前往页面:
      - 自动刮削配置区
  - 场景名称: 整理保存位置不可用
    触发条件: 填写了不存在或系统无法访问的整理目录
    用户可见提示:
      - 目录不可用时，整理任务可能失败
    用户应对动作:
      - 改为填写系统可访问的保存位置
      - 确认目录路径写法正确
    可前往页面:
      - 目录整理配置区

检索关键词:
  - 系统设置
  - 后台刮削
  - 监控目录
  - 执行周期
  - 自动处理
