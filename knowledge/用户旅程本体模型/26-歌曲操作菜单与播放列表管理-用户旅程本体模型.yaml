旅程对象:
  名称: 歌曲操作菜单与播放列表管理使用指引
  说明: 帮助用户对单首歌曲执行队列、歌单、收藏和删除等操作

页面对象:
  - 歌曲操作菜单
  - 添加到播放列表面板
  - 删除音乐确认面板

表单对象:
  歌曲操作表单:
    - 字段名: 目标播放列表
      是否必填: 条件必填
      输入类型: 单选
      格式要求:
        - 添加歌曲到现有歌单时必须选择目标播放列表
      错误提示:
        - 未选择目标播放列表时，无法完成添加操作
    - 字段名: 新播放列表名称
      是否必填: 条件必填
      输入类型: 文本
      格式要求:
        - 新建歌单时必须填写名称
        - 名称不能为空
      错误提示:
        - 播放列表名称不能为空
    - 字段名: 删除方式
      是否必填: 条件必填
      输入类型: 单选
      格式要求:
        - 删除歌曲时需明确选择删除音乐或删除收藏
      错误提示:
        - 未选择删除方式时，无法继续执行删除

操作步骤对象:
  - 步骤名称: 打开歌曲操作菜单
    用户动作: 在歌曲右侧打开更多操作
    系统反馈: 显示队列、歌单、收藏、编辑和删除入口
    后续动作: 选择一种操作

  - 步骤名称: 添加到播放列表
    用户动作: 选择已有播放列表，或新建后加入
    填写项:
      - 目标播放列表
      - 新播放列表名称
    系统反馈: 提示添加成功
    后续动作: 进入播放列表查看

  - 步骤名称: 调整播放队列
    用户动作: 选择添加下一首、添加到队列或移出队列
    系统反馈: 当前播放队列更新
    后续动作: 前往正在播放页收听

  - 步骤名称: 收藏或取消收藏歌曲
    用户动作: 切换喜爱状态
    系统反馈: 歌曲进入或移出喜爱列表
    后续动作: 在收藏页查看

  - 步骤名称: 删除音乐或删除收藏
    用户动作: 选择删除音乐或删除收藏
    填写项:
      - 删除方式
    系统反馈:
      - 删除音乐会同时删除文件
      - 删除收藏只移出收藏记录
    后续动作: 返回歌曲列表

反馈对象:
  - 添加到播放列表
  - 添加成功
  - 删除音乐
  - 删除收藏
  - 添加到喜爱

结果对象:
  - 已更新的播放队列
  - 已更新的播放列表
  - 喜爱状态变化
  - 删除结果

错误场景对象:
  - 场景名称: 未选择目标播放列表
    触发条件: 添加歌曲到歌单时，没有选择目标播放列表
    用户可见提示:
      - 未选择目标播放列表时，无法完成添加操作
    用户应对动作:
      - 先选择一个已有歌单，或新建歌单后再继续
    可前往页面:
      - 添加到播放列表面板
  - 场景名称: 新播放列表名称为空
    触发条件: 选择新建歌单加入，但没有填写歌单名称
    用户可见提示:
      - 播放列表名称不能为空
    用户应对动作:
      - 填写歌单名称后重新提交
    可前往页面:
      - 添加到播放列表面板
  - 场景名称: 未选择删除方式
    触发条件: 删除歌曲时，没有明确选择删除音乐或删除收藏
    用户可见提示:
      - 未选择删除方式时，无法继续执行删除
    用户应对动作:
      - 先选择删除方式，再重新确认
    可前往页面:
      - 删除音乐确认面板

检索关键词:
  - 单首歌曲操作
  - 添加到播放列表
  - 删除音乐
  - 删除收藏
  - 添加下一首
