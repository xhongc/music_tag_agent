旅程对象:
  名称: 分享播放列表访问与复制使用指引
  说明: 帮助访问者打开分享歌单、通过密码验证并复制到自己的账户

页面对象:
  - 分享播放列表页
  - 密码验证界面
  - 分享信息横幅
  - 曲目列表区域

表单对象:
  分享访问表单:
    - 字段名: 访问密码
      是否必填: 条件必填
      输入类型: 密码
      格式要求:
        - 仅在分享内容受密码保护时必须填写
      错误提示:
        - 此播放列表受密码保护
        - 密码错误

操作步骤对象:
  - 步骤名称: 打开分享链接
    用户动作: 进入分享播放列表页
    系统反馈:
      - 无密码时直接展示歌单内容
      - 有密码时先进入验证界面
    后续动作: 输入密码或直接浏览

  - 步骤名称: 验证访问密码
    用户动作: 输入访问密码并确认
    填写项:
      - 访问密码
    系统反馈:
      - 验证成功后显示歌单内容
      - 验证失败时提示密码错误
    后续动作: 播放全部或复制

  - 步骤名称: 浏览并复制播放列表
    用户动作: 播放全部或点击复制到我的播放列表
    系统反馈:
      - 显示分享人和分享时间
      - 复制成功后可跳转到自己的歌单
    后续动作: 在自己的账户继续管理

反馈对象:
  - 此播放列表受密码保护
  - 验证中
  - 复制到我的播放列表
  - 播放列表已复制到您的账户
  - 访问失败

结果对象:
  - 已访问的分享歌单
  - 已复制到个人账户的歌单

错误场景对象:
  - 场景名称: 分享密码未填写
    触发条件: 分享内容受密码保护，但访问者没有输入密码就直接确认
    用户可见提示:
      - 此播放列表受密码保护
    用户应对动作:
      - 先输入访问密码，再继续验证
    可前往页面:
      - 密码验证界面
  - 场景名称: 分享密码错误
    触发条件: 已输入访问密码，但内容与分享设置不一致
    用户可见提示:
      - 密码错误
      - 访问失败
    用户应对动作:
      - 重新核对密码后再次输入
      - 如仍无法访问，请向分享人确认密码是否已变更
    可前往页面:
      - 密码验证界面

检索关键词:
  - 分享播放列表
  - 访问密码
  - 复制到我的播放列表
  - 分享歌单
