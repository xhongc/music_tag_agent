旅程对象:
  名称: 播放列表详情编辑导出分享与去重使用指引
  说明: 帮助用户在播放列表详情页完成维护、导出、分享和规则编辑

页面对象:
  - 播放列表详情页
  - 编辑播放列表信息面板
  - 智能规则编辑面板
  - 删除播放列表确认面板

表单对象:
  播放列表详情表单:
    - 字段名: 名称
      是否必填: 建议必填
      输入类型: 文本
      格式要求:
        - 建议填写清晰可识别的播放列表名称
        - 名称不能为空
      错误提示:
        - 播放列表名称不能为空
    - 字段名: 封面
      是否必填: 选填
      输入类型: 图片
      格式要求:
        - 仅支持 JPG、PNG、GIF
        - 图片大小不超过 5MB
      错误提示:
        - 图片格式不支持时，无法上传封面
        - 图片过大时，无法上传封面
    - 字段名: 描述
      是否必填: 选填
      输入类型: 长文本
      格式要求:
        - 可填写歌单说明或备注
      错误提示:
        - 无
    - 字段名: 智能规则条件
      是否必填: 条件必填
      输入类型: 长文本
      格式要求:
        - 在智能歌单场景下应填写生成规则
      错误提示:
        - 规则条件不完整时，歌单内容可能无法正常生成
    - 字段名: 过滤规则
      是否必填: 选填
      输入类型: 长文本
      格式要求:
        - 可填写需要排除的条件
      错误提示:
        - 过滤规则格式不正确时，歌单结果可能不符合预期

操作步骤对象:
  - 步骤名称: 编辑播放列表信息
    用户动作: 打开编辑播放列表信息面板
    填写项:
      - 名称
      - 封面
      - 描述
    系统反馈: 可保存歌单基础信息与封面
    后续动作: 返回详情页查看

  - 步骤名称: 导出或分享播放列表
    用户动作: 在更多操作中选择导出播放列表或分享播放列表
    系统反馈:
      - 导出时生成可保存文件
      - 分享时生成可访问的分享入口
    后续动作: 外部访问或备份使用

  - 步骤名称: 编辑智能歌单规则
    用户动作: 打开智能规则编辑器
    填写项:
      - 智能规则条件
      - 过滤规则
    系统反馈: 规则保存后影响歌单内容生成
    后续动作: 查看歌单刷新结果

  - 步骤名称: 列表去重复或删除播放列表
    用户动作: 执行列表去重复，或删除当前播放列表
    系统反馈:
      - 去重复后列表更干净
      - 删除时仅移出收藏记录，不删除源文件
    后续动作: 返回播放列表库

反馈对象:
  - 编辑播放列表信息
  - 导出播放列表
  - 分享播放列表
  - 列表去重复
  - 编辑智能播放列表规则
  - 删除播放列表

结果对象:
  - 已更新的播放列表信息
  - 导出文件
  - 分享结果
  - 去重后的播放列表
  - 更新后的智能规则

错误场景对象:
  - 场景名称: 播放列表名称为空
    触发条件: 编辑播放列表信息时，没有填写名称就直接保存
    用户可见提示:
      - 播放列表名称不能为空
    用户应对动作:
      - 补充播放列表名称后重新保存
    可前往页面:
      - 编辑播放列表信息面板
  - 场景名称: 播放列表封面格式不支持
    触发条件: 上传了 JPG、PNG、GIF 之外的歌单封面
    用户可见提示:
      - 图片格式不支持时，无法上传封面
    用户应对动作:
      - 改为上传 JPG、PNG 或 GIF 图片
    可前往页面:
      - 编辑播放列表信息面板
  - 场景名称: 播放列表封面超过大小限制
    触发条件: 上传的歌单封面大于 5MB
    用户可见提示:
      - 图片过大时，无法上传封面
    用户应对动作:
      - 压缩图片后重新上传
      - 将图片大小控制在 5MB 以内
    可前往页面:
      - 编辑播放列表信息面板
  - 场景名称: 智能规则条件不完整
    触发条件: 编辑智能歌单时，没有填写完整规则条件
    用户可见提示:
      - 规则条件不完整时，歌单内容可能无法正常生成
    用户应对动作:
      - 重新补全智能规则条件
      - 保存后刷新歌单查看结果
    可前往页面:
      - 智能规则编辑面板

检索关键词:
  - 播放列表详情
  - 编辑播放列表
  - 导出播放列表
  - 分享播放列表
  - 列表去重复
