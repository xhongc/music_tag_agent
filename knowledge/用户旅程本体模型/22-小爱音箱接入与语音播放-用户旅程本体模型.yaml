旅程对象:
  名称: 小爱音箱接入与语音播放使用指引
  说明: 帮助用户连接小爱设备、测试播放能力并启用语音控制

页面对象:
  - 系统设置页
  - 小爱音箱设置区
  - 设备管理区
  - 播放配置区
  - 测试功能区

表单对象:
  小爱接入表单:
    - 字段名: 小米账号ID
      是否必填: 建议必填
      输入类型: 文本
      格式要求:
        - 连接账号登录场景下建议填写
      错误提示:
        - 未填写账号时，可能无法查询设备
    - 字段名: 账号密码
      是否必填: 建议必填
      输入类型: 密码
      格式要求:
        - 连接账号登录场景下建议填写
      错误提示:
        - 未填写密码时，可能无法完成登录
    - 字段名: 登录Cookie
      是否必填: 选填
      输入类型: 长文本
      格式要求:
        - 可选手动填写登录 Cookie 作为备用登录方式
      错误提示:
        - Cookie 无效时，系统无法复用登录状态
    - 字段名: 设备名称
      是否必填: 条件必填
      输入类型: 文本
      格式要求:
        - 在手动配置设备时需要填写
      错误提示:
        - 请输入设备名称
    - 字段名: 设备型号
      是否必填: 条件必填
      输入类型: 文本
      格式要求:
        - 在手动配置设备时需要填写
      错误提示:
        - 请输入设备型号
    - 字段名: 播放口令
      是否必填: 选填
      输入类型: 文本
      格式要求:
        - 建议填写便于语音触发的播放口令
      错误提示:
        - 无
    - 字段名: 对话间隔时间
      是否必填: 选填
      输入类型: 数字
      格式要求:
        - 应填写数字
        - 建议填写大于 0 的秒数
      错误提示:
        - 对话间隔时间格式不正确时，无法正常保存
    - 字段名: 内网地址和端口
      是否必填: 条件必填
      输入类型: 文本
      格式要求:
        - 应填写为 地址:端口 的形式
      错误提示:
        - 内网地址和端口格式不正确
    - 字段名: 是否启用语音唤醒
      是否必填: 选填
      输入类型: 开关
      格式要求:
        - 开启后可使用语音方式触发播放
      错误提示:
        - 无
    - 字段名: 是否在播放列表显示小爱播放按钮
      是否必填: 选填
      输入类型: 开关
      格式要求:
        - 开启后会在相关页面显示小爱播放入口
      错误提示:
        - 无

操作步骤对象:
  - 步骤名称: 填写账号信息
    用户动作: 输入小米账号信息，必要时补充登录Cookie
    填写项:
      - 小米账号ID
      - 账号密码
      - 登录Cookie
    系统反馈: 可用于查询和连接小爱设备
    后续动作: 查找设备

  - 步骤名称: 查找并管理设备
    用户动作: 点击查找设备，启用或编辑设备信息
    填写项:
      - 设备名称
      - 设备型号
    系统反馈: 显示可用音箱设备列表
    后续动作: 配置播放规则

  - 步骤名称: 配置语音播放
    用户动作: 设置播放口令、轮询间隔、网络地址与功能开关
    填写项:
      - 播放口令
      - 对话间隔时间
      - 内网地址和端口
      - 是否启用语音唤醒
      - 是否在播放列表显示小爱播放按钮
    系统反馈: 保存成功后可通过小爱进行播放控制
    后续动作: 执行测试

  - 步骤名称: 测试连接与播放
    用户动作: 使用测试连接、测试播放等功能验证效果
    系统反馈:
      - 连接成功时音箱会有响应
      - 播放测试通过后可在播放页面切换到小爱音箱
    后续动作: 返回播放页面正式使用

反馈对象:
  - 查找设备
  - 清除Token
  - 测试连接
  - 测试播放
  - 已清除登录token

结果对象:
  - 已连接的小爱设备
  - 语音播放配置
  - 小爱播放能力

错误场景对象:
  - 场景名称: 小米账号信息不完整
    触发条件: 使用账号登录方式连接小爱设备时，没有填写账号或密码
    用户可见提示:
      - 未填写账号时，可能无法查询设备
      - 未填写密码时，可能无法完成登录
    用户应对动作:
      - 补全小米账号ID和账号密码
      - 如账号方式不可用，可改用登录 Cookie 方式
    可前往页面:
      - 小爱音箱设置区
  - 场景名称: 设备信息未填写
    触发条件: 手动配置设备时，没有填写设备名称或设备型号
    用户可见提示:
      - 请输入设备名称
      - 请输入设备型号
    用户应对动作:
      - 补全设备名称和设备型号后再保存
    可前往页面:
      - 设备管理区
  - 场景名称: 内网地址和端口格式不正确
    触发条件: 填写播放服务地址时，没有按照 地址:端口 的形式输入
    用户可见提示:
      - 内网地址和端口格式不正确
    用户应对动作:
      - 改为填写 地址:端口 的形式
      - 检查地址和端口之间是否使用英文冒号分隔
    可前往页面:
      - 播放配置区
  - 场景名称: 对话间隔时间不是数字
    触发条件: 在对话间隔时间中输入了非数字内容
    用户可见提示:
      - 对话间隔时间格式不正确时，无法正常保存
    用户应对动作:
      - 改为填写数字
      - 建议填写大于 0 的秒数
    可前往页面:
      - 播放配置区
  - 场景名称: 登录Cookie无效
    触发条件: 手动填写的登录 Cookie 已失效或内容不完整
    用户可见提示:
      - Cookie 无效时，系统无法复用登录状态
    用户应对动作:
      - 重新获取新的登录 Cookie
      - 或改为重新使用账号方式登录
    可前往页面:
      - 小爱音箱设置区

检索关键词:
  - 小爱音箱
  - 语音播放
  - 查找设备
  - 小米账号
  - 测试连接
