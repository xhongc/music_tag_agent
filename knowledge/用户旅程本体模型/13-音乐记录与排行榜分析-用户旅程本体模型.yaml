旅程对象:
  名称: 音乐记录与排行榜分析使用指引
  说明: 帮助用户查看最近播放、最佳音乐与收听趋势分析

页面对象:
  - 音乐记录页
  - 排行榜区域
  - 快速事实区域

表单对象:
  统计周期表单:
    - 字段名: 统计周期
      是否必填: 必填
      输入类型: 单选
      格式要求:
        - 仅可从最近一周、最近一月、最近一年中选择一个预设周期
      错误提示:
        - 未选择周期时，系统将使用默认周期展示

操作步骤对象:
  - 步骤名称: 进入音乐记录页
    用户动作: 从首页或导航进入音乐记录
    系统反馈: 展示当前周期的听歌统计
    后续动作: 切换时间周期

  - 步骤名称: 切换统计周期
    用户动作: 选择最近一周、最近一月或最近一年
    填写项:
      - 统计周期
    系统反馈: 图表与榜单按周期刷新
    后续动作: 查看不同分类排行

  - 步骤名称: 查看榜单与事实
    用户动作: 浏览最佳艺术家、最佳专辑、最佳单曲、最热风格、平台分布和收听时钟
    系统反馈: 展示排行名次与变化趋势
    后续动作: 用于复盘个人收听偏好

反馈对象:
  - 音乐播放
  - 最佳音乐
  - 最热风格
  - 平台分布
  - 快速事实

结果对象:
  - 周期听歌报告
  - 排行榜结果
  - 收听趋势图表

错误场景对象:
  - 场景名称: 未选择统计周期
    触发条件: 进入音乐记录页后，没有主动切换周期
    用户可见提示:
      - 未选择周期时，系统将使用默认周期展示
    用户应对动作:
      - 直接选择最近一周、最近一月或最近一年中的一个周期
    可前往页面:
      - 音乐记录页

检索关键词:
  - 音乐记录
  - 排行榜
  - 最佳专辑
  - 最佳单曲
  - 收听趋势
