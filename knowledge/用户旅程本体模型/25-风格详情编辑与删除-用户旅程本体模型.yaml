旅程对象:
  名称: 风格详情编辑与删除使用指引
  说明: 帮助用户在风格页面浏览专辑与歌曲，并维护风格封面

页面对象:
  - 风格详情页
  - 编辑流派与风格信息面板
  - 删除风格确认面板

表单对象:
  风格编辑表单:
    - 字段名: 风格名称
      是否必填: 选填
      输入类型: 文本
      格式要求:
        - 可填写风格名称或补充别名
      错误提示:
        - 无
    - 字段名: 风格封面
      是否必填: 选填
      输入类型: 图片
      格式要求:
        - 仅支持 JPG、PNG、GIF
        - 图片大小不超过 5MB
      错误提示:
        - 图片格式不支持时，无法上传封面
        - 图片过大时，无法上传封面

操作步骤对象:
  - 步骤名称: 浏览风格内容
    用户动作: 进入风格详情页
    系统反馈: 可在专辑和歌曲两个分页间切换
    后续动作: 浏览内容或编辑风格信息

  - 步骤名称: 编辑风格封面
    用户动作: 打开编辑流派与风格信息面板
    填写项:
      - 风格封面
    系统反馈: 支持上传、替换和选择推荐封面
    后续动作: 保存结果

  - 步骤名称: 删除风格
    用户动作: 提交删除确认
    系统反馈: 从音乐收藏中删除此风格，但不会删除源文件
    后续动作: 返回风格列表

反馈对象:
  - 编辑流派与风格信息
  - 保存
  - 删除风格

结果对象:
  - 已更新的风格封面
  - 风格下的专辑与歌曲列表
  - 删除后的收藏结果

错误场景对象:
  - 场景名称: 风格封面格式不支持
    触发条件: 上传了系统不支持的风格封面图片
    用户可见提示:
      - 图片格式不支持时，无法上传封面
    用户应对动作:
      - 改为上传 JPG、PNG 或 GIF 图片
    可前往页面:
      - 编辑流派与风格信息面板
  - 场景名称: 风格封面超过大小限制
    触发条件: 上传的风格封面大于 5MB
    用户可见提示:
      - 图片过大时，无法上传封面
    用户应对动作:
      - 压缩图片后重新上传
      - 将图片大小控制在 5MB 以内
    可前往页面:
      - 编辑流派与风格信息面板

检索关键词:
  - 风格详情
  - 编辑风格
  - 风格封面
  - 删除风格
  - 流派
