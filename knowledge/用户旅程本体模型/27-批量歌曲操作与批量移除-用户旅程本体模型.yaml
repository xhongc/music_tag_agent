旅程对象:
  名称: 批量歌曲操作与批量移除使用指引
  说明: 帮助用户一次性处理多首歌曲的歌单与删除动作

页面对象:
  - 歌曲列表批量工具栏
  - 播放列表选择面板
  - 批量删除确认区

表单对象:
  批量歌曲操作表单:
    - 字段名: 目标播放列表
      是否必填: 条件必填
      输入类型: 单选
      格式要求:
        - 批量加入歌单时必须选择一个目标播放列表
      错误提示:
        - 未选择目标播放列表时，无法完成批量加入
    - 字段名: 删除方式
      是否必填: 条件必填
      输入类型: 单选
      格式要求:
        - 批量删除时需明确选择删除方式
      错误提示:
        - 未选择删除方式时，无法继续执行批量删除

操作步骤对象:
  - 步骤名称: 勾选多首歌曲
    用户动作: 在歌曲列表中勾选多个条目
    系统反馈: 批量工具栏出现
    后续动作: 选择批量操作

  - 步骤名称: 批量加入播放列表
    用户动作: 打开添加到播放列表面板并选择目标歌单
    填写项:
      - 目标播放列表
    系统反馈: 多首歌曲被加入目标播放列表
    后续动作: 打开歌单查看

  - 步骤名称: 批量移出播放列表
    用户动作: 在播放列表场景下执行移出操作
    系统反馈: 已勾选歌曲从当前播放列表中移除
    后续动作: 刷新列表结果

  - 步骤名称: 批量删除音乐
    用户动作: 对勾选歌曲执行删除
    填写项:
      - 删除方式
    系统反馈: 按所选删除方式处理多首歌曲
    后续动作: 返回歌曲列表确认结果

反馈对象:
  - 添加到播放列表
  - 移出播放列表
  - 删除音乐
  - 获取播放列表失败

结果对象:
  - 批量歌单更新结果
  - 批量删除结果

错误场景对象:
  - 场景名称: 未选择目标播放列表
    触发条件: 批量加入歌单时，没有选择目标播放列表
    用户可见提示:
      - 未选择目标播放列表时，无法完成批量加入
    用户应对动作:
      - 先选择一个目标歌单，再重新提交
    可前往页面:
      - 播放列表选择面板
  - 场景名称: 未选择删除方式
    触发条件: 批量删除歌曲时，没有选择删除方式
    用户可见提示:
      - 未选择删除方式时，无法继续执行批量删除
    用户应对动作:
      - 先选择删除方式，再重新执行批量删除
    可前往页面:
      - 批量删除确认区
  - 场景名称: 获取播放列表失败
    触发条件: 打开批量加入歌单面板时，系统没有正常加载歌单列表
    用户可见提示:
      - 获取播放列表失败
    用户应对动作:
      - 关闭面板后重试
      - 如仍失败，稍后重新进入页面
    可前往页面:
      - 播放列表选择面板

检索关键词:
  - 批量操作歌曲
  - 批量加歌单
  - 批量移出播放列表
  - 批量删除
