旅程对象:
  名称: 操作台导入收藏使用指引
  说明: 帮助用户从目录中选择音乐并导入到收藏中

页面对象:
  - 操作台
  - 文件列表区域
  - 搜索区域
  - 导入收藏操作区
  - 操作记录页

表单对象:
  导入收藏表单:
    - 字段名: 音乐目录
      是否必填: 选填
      输入类型: 路径
      格式要求:
        - 可直接输入当前要浏览或导入的音乐目录
        - 建议填写系统可访问的本地目录路径
      错误提示:
        - 目录不可访问时，文件列表可能无法正常加载
    - 字段名: 是否深度遍历子目录
      是否必填: 选填
      输入类型: 开关
      格式要求:
        - 开启后会继续读取子目录中的音乐内容
      错误提示:
        - 无
    - 字段名: 搜索条件
      是否必填: 选填
      输入类型: 文本
      格式要求:
        - 可输入文件名、目录名或关键词缩小范围
      错误提示:
        - 无匹配内容时，列表会显示为空

操作步骤对象:
  - 步骤名称: 进入操作台
    用户动作: 从首页导航进入操作台
    系统反馈: 显示文件树、目录输入框和搜索框
    后续动作: 选择目录

  - 步骤名称: 选择目录或文件
    用户动作: 输入文件夹路径或在文件列表区域勾选文件夹与歌曲
    填写项:
      - 音乐目录
      - 是否深度遍历子目录
    系统反馈: 文件列表更新为可处理内容
    后续动作: 确认导入范围

  - 步骤名称: 搜索需要导入的内容
    用户动作: 使用搜索框缩小范围
    填写项:
      - 搜索条件
    系统反馈: 列表显示匹配的文件和文件夹
    后续动作: 勾选目标内容

  - 步骤名称: 提交导入收藏
    用户动作: 点击“导入收藏”
    系统反馈:
      - 未选择内容时提示“请先选择文件或文件夹”
      - 创建成功时提示“任务正在处理中”
    后续动作: 前往操作记录页查看结果

反馈对象:
  - 请先选择文件或文件夹
  - 创建成功，任务正在处理中
  - 当前内容为空，请先导入音乐

结果对象:
  - 导入收藏任务
  - 音乐收藏结果
  - 导入日志记录

错误场景对象:
  - 场景名称: 目录不可访问
    触发条件: 在音乐目录中填写了系统无法访问的路径
    用户可见提示:
      - 目录不可访问时，文件列表可能无法正常加载
    用户应对动作:
      - 改为填写系统可访问的本地目录路径
      - 检查路径是否完整、是否存在
    可前往页面:
      - 操作台
  - 场景名称: 未选择文件或文件夹
    触发条件: 没有勾选任何内容就直接点击导入收藏
    用户可见提示:
      - 请先选择文件或文件夹
    用户应对动作:
      - 先勾选要导入的歌曲或文件夹，再重新提交
    可前往页面:
      - 文件列表区域
  - 场景名称: 搜索后没有结果
    触发条件: 输入搜索条件后，当前目录中没有匹配内容
    用户可见提示:
      - 无匹配内容时，列表会显示为空
    用户应对动作:
      - 更换搜索关键词
      - 清空搜索条件后重新浏览目录
    可前往页面:
      - 搜索区域

检索关键词:
  - 导入收藏
  - 导入音乐
  - 选择目录
  - 文件树
  - 操作台
