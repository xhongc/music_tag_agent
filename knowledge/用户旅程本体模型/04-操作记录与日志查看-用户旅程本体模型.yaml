旅程对象:
  名称: 操作记录与日志查看使用指引
  说明: 帮助用户查看导入、自动刮削和后台处理的执行情况

页面对象:
  - 操作记录页
  - 日志详情页

表单对象:
  记录筛选表单:
    - 字段名: 任务类型
      是否必填: 选填
      输入类型: 单选
      格式要求:
        - 从系统提供的任务类型中选择，如导入收藏、自动刮削、后台处理
      错误提示:
        - 无
    - 字段名: 状态条件
      是否必填: 选填
      输入类型: 单选
      格式要求:
        - 从处理中、已完成、处理失败等状态中选择
      错误提示:
        - 无
    - 字段名: 关键词
      是否必填: 选填
      输入类型: 文本
      格式要求:
        - 可输入任务名称、目录名或相关关键词筛选记录
      错误提示:
        - 无匹配内容时，列表会显示暂无相关记录

操作步骤对象:
  - 步骤名称: 进入操作记录页
    用户动作: 从导航进入操作记录页
    系统反馈: 显示任务列表
    后续动作: 按类型筛选

  - 步骤名称: 筛选任务
    用户动作: 选择导入收藏、自动刮削或后台刮削
    填写项:
      - 任务类型
      - 状态条件
      - 关键词
    系统反馈: 列表按条件过滤
    后续动作: 打开某条记录

  - 步骤名称: 查看日志详情
    用户动作: 进入日志详情页
    系统反馈:
      - 显示成功项
      - 显示失败项
      - 显示未匹配项
      - 显示失败原因
    后续动作: 返回操作台继续处理

反馈对象:
  - 处理中
  - 已完成
  - 处理失败
  - 暂无相关记录

结果对象:
  - 任务进度
  - 处理结果
  - 失败原因
  - 日志记录

错误场景对象:
  - 场景名称: 筛选后没有结果
    触发条件: 选择了较严格的任务类型、状态或关键词后，没有匹配记录
    用户可见提示:
      - 暂无相关记录
    用户应对动作:
      - 放宽筛选条件
      - 清空关键词后重新查看
    可前往页面:
      - 操作记录页
  - 场景名称: 任务长时间处理中
    触发条件: 用户进入操作记录页时，任务仍未完成
    用户可见提示:
      - 处理中
    用户应对动作:
      - 稍后刷新页面重新查看
      - 如等待过久，可查看失败原因或回到原功能页检查配置
    可前往页面:
      - 操作记录页

检索关键词:
  - 操作记录
  - 日志详情
  - 任务进度
  - 失败原因
  - 结果查看
