旅程对象:
  名称: 艺术家详情编辑收藏与删除使用指引
  说明: 帮助用户在艺术家详情页维护信息、封面与收藏状态

页面对象:
  - 艺术家详情页
  - 编辑艺术家信息面板
  - 删除艺术家确认面板

表单对象:
  艺术家编辑表单:
    - 字段名: 艺术家名称
      是否必填: 建议必填
      输入类型: 文本
      格式要求:
        - 建议填写清晰可识别的艺术家名称
      错误提示:
        - 无
    - 字段名: 艺术家封面
      是否必填: 选填
      输入类型: 图片
      格式要求:
        - 仅支持 JPG、PNG、GIF
        - 图片大小不超过 5MB
      错误提示:
        - 图片格式不支持时，无法上传封面
        - 图片过大时，无法上传封面
    - 字段名: 艺术家描述
      是否必填: 选填
      输入类型: 长文本
      格式要求:
        - 可填写艺术家简介或补充信息
      错误提示:
        - 无

操作步骤对象:
  - 步骤名称: 浏览艺术家详情
    用户动作: 打开艺术家详情
    系统反馈: 展示专辑数量、歌曲数量、热门歌曲、最新专辑和相似艺术家
    后续动作: 收藏、播放或编辑

  - 步骤名称: 收藏艺术家
    用户动作: 点击收藏按钮
    系统反馈: 艺术家进入或移出收藏状态
    后续动作: 在收藏区域查看

  - 步骤名称: 编辑艺术家信息
    用户动作: 打开编辑艺术家信息面板
    填写项:
      - 艺术家名称
      - 艺术家封面
      - 艺术家描述
    系统反馈: 可更换封面、编辑描述并保存
    后续动作: 保存或保存并更新音乐元数据

  - 步骤名称: 删除艺术家
    用户动作: 提交删除确认
    系统反馈: 从音乐收藏中删除此艺术家，但不会删除源文件
    后续动作: 返回艺术家列表

反馈对象:
  - 编辑艺术家信息
  - 保存
  - 保存并更新音乐元数据
  - 删除艺术家

结果对象:
  - 已更新的艺术家信息
  - 收藏状态变化
  - 删除后的收藏结果

错误场景对象:
  - 场景名称: 艺术家封面格式不支持
    触发条件: 上传了系统不支持的艺术家封面图片
    用户可见提示:
      - 图片格式不支持时，无法上传封面
    用户应对动作:
      - 改为上传 JPG、PNG 或 GIF 图片
    可前往页面:
      - 编辑艺术家信息面板
  - 场景名称: 艺术家封面超过大小限制
    触发条件: 上传的艺术家封面大于 5MB
    用户可见提示:
      - 图片过大时，无法上传封面
    用户应对动作:
      - 压缩图片后重新上传
      - 将图片大小控制在 5MB 以内
    可前往页面:
      - 编辑艺术家信息面板

检索关键词:
  - 艺术家详情
  - 编辑艺术家
  - 艺术家封面
  - 删除艺术家
  - 收藏艺术家
