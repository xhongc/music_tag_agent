关键表单校验规则索引:
  名称: 音乐标签平台关键表单校验规则索引
  说明: 面向帮助中心、表单设计、AI问答与操作引导的关键字段校验规则汇总

  校验规则表达说明:
    - 必填: 用户不填写时不能提交
    - 选填: 可不填写，但填写后仍需满足格式要求
    - 数字: 只能填写数字
    - 路径: 应填写目录或文件路径，不应填写描述性文字
    - 固定格式: 需要满足特定结构，例如 5 段表达式、字母数字组合等

  模块校验规则:
    登录与账号:
      - 字段名: 密码
        所在场景:
          - 登录页
          - 小爱音箱接入
          - 网盘账号认证
        校验规则:
          - 登录场景为必填
          - 输入类型为密码
          - 为空时无法完成登录或认证

    操作台元数据编辑:
      - 字段名: 标题
        所在场景:
          - 元数据详情
          - 元数据编辑
        校验规则:
          - 必填
          - 为空时提示“标题不能为空”

      - 字段名: 歌词
        所在场景:
          - 歌词编辑
        校验规则:
          - 在执行部分歌词相关保存动作时为必填
          - 为空时提示“歌词不能为空”

      - 字段名: 专辑封面
        所在场景:
          - 元数据详情
          - 专辑详情编辑
          - 艺术家详情编辑
          - 风格详情编辑
          - 播放列表详情编辑
        校验规则:
          - 选填
          - 仅支持 JPG、PNG、GIF
          - 最大文件大小 5MB
          - 超限时提示“文件过大”

    文件与目录路径:
      - 字段名: 文件夹路径
        所在场景:
          - 操作台路径输入
        校验规则:
          - 选填
          - 应填写目录路径
          - 不应填写无关说明性内容

      - 字段名: 监控目录
        所在场景:
          - 后台刮削设置
        校验规则:
          - 建议必填
          - 应填写目录路径
          - 示例格式为类似 /app/download/qbittorrent 的路径

      - 字段名: 整理后的根目录
        所在场景:
          - 整理文件
          - 后台刮削目录整理
        校验规则:
          - 建议必填
          - 应填写目录路径

      - 字段名: 目标目录
        所在场景:
          - 复制文件配置
        校验规则:
          - 建议必填
          - 应填写目录路径
          - 提示语义为容器内地址

      - 字段名: 原始路径前缀
        所在场景:
          - 导入播放列表
        校验规则:
          - 仅在开启路径替换时需要填写
          - 应填写待替换的旧路径前缀

    定时与周期配置:
      - 字段名: crontab 表达式
        所在场景:
          - 后台刮削执行周期
        校验规则:
          - 必填
          - 不能为空
          - 需要由 5 个字段组成
          - 不满足时提示“crontab 表达式格式错误，应为5个字段”
          - 示例结构: 分钟 小时 日 月 星期

      - 字段名: 执行间隔
        所在场景:
          - 后台任务周期执行
        校验规则:
          - 仅在周期执行时需要填写
          - 应为数字
          - 单位为分钟

    播放列表:
      - 字段名: 播放列表名称
        所在场景:
          - 创建播放列表
          - 创建智能播放列表
          - 导入播放列表
        校验规则:
          - 必填
          - 为空时提示“播放列表名称不能为空”

      - 字段名: 导入文件
        所在场景:
          - 导入播放列表
        校验规则:
          - 必填
          - 应选择播放列表文件
          - 界面说明支持 m3u8 文件

      - 字段名: 访问密码
        所在场景:
          - 分享播放列表访问
        校验规则:
          - 仅在分享设置了密码时必填
          - 为空时无法通过验证
          - 错误时提示“密码错误”或“验证失败，请重试”

    多端同播:
      - 字段名: 房间号
        所在场景:
          - 创建房间
          - 加入房间
        校验规则:
          - 选填
          - 如果手动输入，必须为 4 到 32 位
          - 仅支持字母和数字
          - 不满足时提示“房间号仅支持4-32位字母或数字”

      - 字段名: 聊天消息
        所在场景:
          - 多端同播聊天
        校验规则:
          - 必填
          - 发送前会去除首尾空格
          - 空内容时提示“消息不能为空”

    网盘音乐与 WebDAV:
      - 字段名: OpenList 地址
        所在场景:
          - 网盘音乐管理
        校验规则:
          - 建议必填
          - 应填写可访问的网址
          - 示例格式为 http://主机:端口

      - 字段名: 根目录
        所在场景:
          - 网盘音乐管理
        校验规则:
          - 建议必填
          - 应填写目录路径
          - 示例格式为 /aliyun/音乐

      - 字段名: 显示条数
        所在场景:
          - 网盘音乐管理
        校验规则:
          - 应为数字
          - 最小值为 1

    小爱音箱接入:
      - 字段名: 小米账号ID
        所在场景:
          - 小爱音箱接入
        校验规则:
          - 建议必填
          - 应填写账号ID
          - 界面提示不是手机号

      - 字段名: 登录 Cookie
        所在场景:
          - 小爱音箱接入
        校验规则:
          - 选填
          - 在账号密码无法查询设置时可手动填写

      - 字段名: 设备名称
        所在场景:
          - 小爱设备管理
        校验规则:
          - 建议必填
          - 应填写可识别的设备名称

      - 字段名: 设备型号
        所在场景:
          - 小爱设备管理
        校验规则:
          - 选填但建议填写
          - 应填写设备型号名称

      - 字段名: 对话间隔时间
        所在场景:
          - 小爱播放配置
        校验规则:
          - 应为数字
          - 单位为秒
          - 界面建议设置为 5

      - 字段名: 内网地址和端口
        所在场景:
          - 小爱播放配置
        校验规则:
          - 建议必填
          - 应满足 地址:端口 的形式
          - 示例格式为 192.168.0.115:8002

    AI 接入:
      - 字段名: 对话地址
        所在场景:
          - AI大模型接入
        校验规则:
          - 建议必填
          - 应填写完整地址
          - 结尾应包含 chat/completions
          - 不应省略会话接口尾部路径

      - 字段名: API密钥
        所在场景:
          - AI大模型接入
        校验规则:
          - 建议必填
          - 输入类型为密码

      - 字段名: 模型名称
        所在场景:
          - AI大模型接入
        校验规则:
          - 建议必填
          - 应填写服务商提供的模型名称

    插件管理:
      - 字段名: 插件文件
        所在场景:
          - 插件上传
        校验规则:
          - 必填
          - 仅支持 .py 文件
          - 前端上传限制最大 2MB
          - 超限时提示文件过大

      - 字段名: 插件包
        所在场景:
          - 插件包上传
        校验规则:
          - 仅支持 ZIP 格式
          - 后端限制最大 10MB

      - 字段名: 插件ID
        所在场景:
          - 插件创建与上传
        校验规则:
          - 仅支持字母、数字、下划线和横线

    列表与多选:
      - 字段名: 标签数量
        所在场景:
          - 标签输入
        校验规则:
          - 存在最大数量限制
          - 超限时提示“最多只能添加X个标签”

  建议补充方式:
    - 在每份用户旅程本体的表单对象下增加“校验规则”字段
    - 对帮助中心前台展示时，优先展示必填项和格式要求
    - 对 AI 问答场景，优先召回“错误提示语 + 对应校验规则”
