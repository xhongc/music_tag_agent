旅程对象:
  名称: 播放列表创建导入导出分享使用指引
  说明: 帮助用户管理自己的播放列表，并支持导入、导出和分享

页面对象:
  - 播放列表页
  - 播放列表详情页
  - 分享播放列表页
  - 歌曲操作面板

表单对象:
  播放列表表单:
    - 字段名: 播放列表名称
      是否必填: 必填
      输入类型: 文本
      格式要求:
        - 名称不能为空
        - 建议使用便于识别的歌单名称
      错误提示:
        - 播放列表名称不能为空
    - 字段名: 导入文件
      是否必填: 条件必填
      输入类型: 文件
      格式要求:
        - 在导入播放列表时必须上传文件
        - 建议使用 m3u8 播放列表文件
      错误提示:
        - 未上传文件时，无法执行导入
        - 文件格式不支持时，导入会失败
    - 字段名: 访问密码
      是否必填: 条件必填
      输入类型: 密码
      格式要求:
        - 仅在需要为分享链接设置访问保护时填写
      错误提示:
        - 受密码保护时，访问者必须先输入正确密码
    - 字段名: 目标播放列表
      是否必填: 必填
      输入类型: 单选
      格式要求:
        - 添加歌曲时需要从现有播放列表中选择一个目标歌单
      错误提示:
        - 未选择目标播放列表时，无法完成添加操作

操作步骤对象:
  - 步骤名称: 新建播放列表
    用户动作: 输入播放列表名称并创建
    填写项:
      - 播放列表名称
    系统反馈:
      - 名称为空时提示“播放列表名称不能为空”
      - 创建成功后出现新的播放列表
    后续动作: 添加歌曲

  - 步骤名称: 添加歌曲到播放列表
    用户动作: 在歌曲操作面板中选择“添加到播放列表”
    填写项:
      - 目标播放列表
    系统反馈: 提示已成功添加
    后续动作: 打开播放列表查看

  - 步骤名称: 导入播放列表
    用户动作: 上传播放列表文件并填写名称
    填写项:
      - 播放列表名称
      - 导入文件
    系统反馈: 导入成功后生成新的播放列表
    后续动作: 播放、编辑或继续整理

  - 步骤名称: 导出播放列表
    用户动作: 在播放列表详情页点击导出
    系统反馈: 生成可保存的播放列表文件
    后续动作: 可在其他设备或系统中使用

  - 步骤名称: 分享播放列表
    用户动作: 生成分享内容并设置访问保护
    填写项:
      - 访问密码
    系统反馈:
      - 生成分享页面
      - 如设置密码，则访问时需要先验证
    后续动作: 他人可查看或复制到自己的账户

反馈对象:
  - 播放列表名称不能为空
  - 此播放列表受密码保护
  - 播放列表已复制到您的账户
  - 此播放列表暂无歌曲

结果对象:
  - 播放列表
  - 导入后的播放列表
  - 导出的播放列表文件
  - 分享链接

错误场景对象:
  - 场景名称: 播放列表名称为空
    触发条件: 新建播放列表或导入播放列表时，没有填写名称就直接提交
    用户可见提示:
      - 播放列表名称不能为空
    用户应对动作:
      - 先填写一个便于识别的播放列表名称，再重新提交
    可前往页面:
      - 播放列表页
  - 场景名称: 导入文件未上传
    触发条件: 进入导入播放列表流程，但没有选择任何导入文件
    用户可见提示:
      - 未上传文件时，无法执行导入
    用户应对动作:
      - 先选择一个可用的播放列表文件，再继续导入
      - 建议优先使用 m3u8 文件
    可前往页面:
      - 播放列表页
  - 场景名称: 导入文件格式不支持
    触发条件: 上传了系统不支持的播放列表文件
    用户可见提示:
      - 文件格式不支持时，导入会失败
    用户应对动作:
      - 改为上传系统支持的播放列表文件
      - 如来源系统不同，先转换为 m3u8 再导入
    可前往页面:
      - 播放列表页
  - 场景名称: 未选择目标播放列表
    触发条件: 添加歌曲到播放列表时，没有选择目标歌单
    用户可见提示:
      - 未选择目标播放列表时，无法完成添加操作
    用户应对动作:
      - 先选择一个已有歌单，或先新建歌单后再添加
    可前往页面:
      - 播放列表页
  - 场景名称: 分享访问需要密码
    触发条件: 分享播放列表时启用了访问保护，访问者直接打开分享内容
    用户可见提示:
      - 此播放列表受密码保护
    用户应对动作:
      - 向分享人获取密码
      - 输入正确密码后再继续访问
    可前往页面:
      - 分享播放列表页

检索关键词:
  - 播放列表
  - 新建播放列表
  - 导入播放列表
  - 导出播放列表
  - 分享播放列表
