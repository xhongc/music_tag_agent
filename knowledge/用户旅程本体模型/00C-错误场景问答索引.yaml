索引对象:
  名称: 用户旅程错误场景问答索引
  说明: 汇总各功能模块中用户最常遇到的填写错误、配置错误、访问错误与修正动作，便于帮助中心、AI问答与操作引导统一检索

错误场景分类:
  - 分类名称: 名称与文本填写错误
    适用模块:
      - 06-播放列表创建导入导出分享-用户旅程本体模型.yaml
      - 09-操作台元数据精修与版本历史-用户旅程本体模型.yaml
      - 26-歌曲操作菜单与播放列表管理-用户旅程本体模型.yaml
      - 29-播放列表库创建导入与智能规则-用户旅程本体模型.yaml
    典型问题:
      - 播放列表名称为空
      - 标题为空
      - 聊天消息为空

  - 分类名称: 地址与路径格式错误
    适用模块:
      - 02-操作台导入收藏-用户旅程本体模型.yaml
      - 07-系统设置与后台刮削-用户旅程本体模型.yaml
      - 18-系统网盘音乐与WebDAV接入-用户旅程本体模型.yaml
      - 19-系统开放接口与AI接入-用户旅程本体模型.yaml
      - 22-小爱音箱接入与语音播放-用户旅程本体模型.yaml
    典型问题:
      - 监控目录未填写或不可访问
      - OpenList地址格式不正确
      - 对话地址未写完整
      - 内网地址和端口格式不正确

  - 分类名称: 周期与数字格式错误
    适用模块:
      - 07-系统设置与后台刮削-用户旅程本体模型.yaml
      - 16-系统基础设置与版本管理-用户旅程本体模型.yaml
      - 17-系统后台任务与数据维护-用户旅程本体模型.yaml
      - 18-系统网盘音乐与WebDAV接入-用户旅程本体模型.yaml
      - 22-小爱音箱接入与语音播放-用户旅程本体模型.yaml
      - 29-播放列表库创建导入与智能规则-用户旅程本体模型.yaml
    典型问题:
      - 执行周期格式错误
      - 显示条数不是数字
      - 最多保留条数不是数字
      - 对话间隔时间不是数字

  - 分类名称: 文件与图片上传错误
    适用模块:
      - 06-播放列表创建导入导出分享-用户旅程本体模型.yaml
      - 08-插件管理与扩展能力-用户旅程本体模型.yaml
      - 09-操作台元数据精修与版本历史-用户旅程本体模型.yaml
      - 23-专辑详情编辑收藏与删除-用户旅程本体模型.yaml
      - 24-艺术家详情编辑收藏与删除-用户旅程本体模型.yaml
      - 25-风格详情编辑与删除-用户旅程本体模型.yaml
      - 28-播放列表详情编辑导出分享与去重-用户旅程本体模型.yaml
      - 29-播放列表库创建导入与智能规则-用户旅程本体模型.yaml
    典型问题:
      - 图片格式不支持
      - 图片大小超过限制
      - 播放列表导入文件未上传
      - 插件脚本类型错误
      - 插件安装包类型错误

  - 分类名称: 权限与访问验证错误
    适用模块:
      - 15-播放设备切换与多端同播-用户旅程本体模型.yaml
      - 21-系统角色权限管理-用户旅程本体模型.yaml
      - 30-分享播放列表访问与复制-用户旅程本体模型.yaml
    典型问题:
      - 房间号格式不正确
      - 未选择成员或角色
      - 分享密码错误

统一问答模板:
  - 字段名: 场景名称
    说明: 用用户能理解的话描述问题
  - 字段名: 触发条件
    说明: 什么情况下会出现这个问题
  - 字段名: 用户可见提示
    说明: 用户实际看到的提示语或可感知现象
  - 字段名: 用户应对动作
    说明: 用户下一步应该如何修正
  - 字段名: 可前往页面
    说明: 出错后建议返回或跳转到哪里继续处理

使用建议:
  - 帮助中心优先展示“用户可见提示 + 用户应对动作”
  - AI问答优先按“功能模块 + 场景名称 + 用户可见提示”召回
  - 操作引导可在步骤失败后直接展示对应错误场景
