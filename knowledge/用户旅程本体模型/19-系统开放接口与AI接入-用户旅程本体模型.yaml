旅程对象:
  名称: 系统开放接口与AI接入使用指引
  说明: 帮助管理员生成接口访问凭证、查看接口文档并配置AI能力

页面对象:
  - 系统设置页
  - API管理区
  - 开放接口文档区
  - AI接入配置区

表单对象:
  接口与AI配置表单:
    - 字段名: 访问令牌
      是否必填: 选填
      输入类型: 文本
      格式要求:
        - 可使用系统生成的访问令牌
        - 建议完整复制后再用于外部接入
      错误提示:
        - 访问令牌缺失或不正确时，外部访问会失败
    - 字段名: 对话地址
      是否必填: 必填
      输入类型: 地址
      格式要求:
        - 必须填写完整的对话接口地址
        - 结尾应包含 chat/completions
      错误提示:
        - 请输入完整的对话接口地址
        - 地址结尾不要省略 chat/completions
    - 字段名: API密钥
      是否必填: 必填
      输入类型: 密码
      格式要求:
        - 必须填写可用的模型服务密钥
      错误提示:
        - 未填写 API 密钥时，无法调用 AI 服务
    - 字段名: 模型名称
      是否必填: 必填
      输入类型: 文本
      格式要求:
        - 必须填写要使用的模型名称
      错误提示:
        - 未填写模型名称时，无法完成 AI 配置
    - 字段名: 是否默认展示助手入口
      是否必填: 选填
      输入类型: 开关
      格式要求:
        - 开启后会在系统中默认显示助手入口
      错误提示:
        - 无

操作步骤对象:
  - 步骤名称: 生成访问令牌
    用户动作: 在API管理区生成或填写访问令牌
    填写项:
      - 访问令牌
    系统反馈: 新令牌生效，可复制使用
    后续动作: 查看接口文档

  - 步骤名称: 查看开放接口文档
    用户动作: 展开某个接口的文档说明
    系统反馈: 显示功能说明、接口地址、请求头、请求参数与返回示例
    后续动作: 将接口接入外部系统

  - 步骤名称: 配置AI服务
    用户动作: 填写对话地址、API密钥和模型名称
    填写项:
      - 对话地址
      - API密钥
      - 模型名称
      - 是否默认展示助手入口
    系统反馈: 保存成功后可在相关AI能力中使用
    后续动作: 返回操作台或助手入口体验AI功能

反馈对象:
  - 生成Token
  - 复制
  - 开放 API 接口
  - AI大模型接入
  - 配置说明

结果对象:
  - 接口访问凭证
  - 接口文档
  - AI接入配置结果

错误场景对象:
  - 场景名称: 对话地址填写不完整
    触发条件: 配置 AI 服务时，只填写了基础域名或缺少完整接口结尾
    用户可见提示:
      - 请输入完整的对话接口地址
      - 地址结尾不要省略 chat/completions
    用户应对动作:
      - 将地址补全为完整的对话接口地址
      - 重点检查结尾是否包含 chat/completions
    可前往页面:
      - AI接入配置区
  - 场景名称: 未填写API密钥
    触发条件: 保存 AI 服务配置时，没有填写密钥
    用户可见提示:
      - 未填写 API 密钥时，无法调用 AI 服务
    用户应对动作:
      - 补充可用的 API 密钥后重新保存
    可前往页面:
      - AI接入配置区
  - 场景名称: 未填写模型名称
    触发条件: 保存 AI 服务配置时，没有填写模型名称
    用户可见提示:
      - 未填写模型名称时，无法完成 AI 配置
    用户应对动作:
      - 填写要调用的模型名称后重新保存
    可前往页面:
      - AI接入配置区
  - 场景名称: 外部访问令牌不可用
    触发条件: 使用不完整或错误的访问令牌接入外部系统
    用户可见提示:
      - 访问令牌缺失或不正确时，外部访问会失败
    用户应对动作:
      - 重新生成或完整复制访问令牌
      - 替换外部系统中的旧令牌
    可前往页面:
      - API管理区

检索关键词:
  - API
  - Token
  - 开放接口
  - AI接入
  - 模型配置
