旅程对象:
  名称: 系统网盘音乐与WebDAV接入使用指引
  说明: 帮助管理员接入网盘音乐、配置OpenList并管理WebDAV方式访问

页面对象:
  - 系统设置页
  - 网盘音乐管理区

表单对象:
  网盘接入表单:
    - 字段名: 工作模式
      是否必填: 必填
      输入类型: 单选
      格式要求:
        - 从直连模式和本地挂载中选择一种方式
      错误提示:
        - 未选择工作模式时，无法显示对应配置项
    - 字段名: OpenList地址
      是否必填: 必填
      输入类型: 地址
      格式要求:
        - 必须填写完整可访问的 URL
      错误提示:
        - 请输入 OpenList 的 URL
        - 地址格式不正确时，无法建立连接
    - 字段名: 根目录
      是否必填: 必填
      输入类型: 路径
      格式要求:
        - 必须填写 OpenList 中要展示的根目录
      错误提示:
        - 请输入 OpenList 的根目录
    - 字段名: 用户名
      是否必填: 必填
      输入类型: 文本
      格式要求:
        - 必须填写访问 OpenList 的账号
      错误提示:
        - 请输入账号
    - 字段名: 密码
      是否必填: 必填
      输入类型: 密码
      格式要求:
        - 必须填写访问 OpenList 的密码
      错误提示:
        - 请输入密码
    - 字段名: 显示条数
      是否必填: 建议必填
      输入类型: 数字
      格式要求:
        - 必须是数字
        - 建议填写大于等于 1 的整数
      错误提示:
        - 请输入显示的条数

操作步骤对象:
  - 步骤名称: 选择工作模式
    用户动作: 在直连模式和本地挂载之间选择一种方式
    填写项:
      - 工作模式
    系统反馈: 显示对应的配置表单
    后续动作: 填写连接信息

  - 步骤名称: 配置网盘连接
    用户动作: 填写OpenList地址、根目录和账号认证信息
    填写项:
      - OpenList地址
      - 根目录
      - 用户名
      - 密码
      - 显示条数
    系统反馈: 保存成功后可访问网盘音乐
    后续动作: 返回操作台浏览挂载目录

  - 步骤名称: 清除缓存
    用户动作: 点击清除缓存
    系统反馈: 网盘缓存元数据被清理
    后续动作: 重新加载目录内容

反馈对象:
  - 网盘音乐管理
  - 修改成功
  - 清除缓存
  - 挂载路径

结果对象:
  - 已接入的网盘音乐目录
  - 网盘配置结果

错误场景对象:
  - 场景名称: OpenList地址格式不正确
    触发条件: 填写的 OpenList 地址不是完整可访问的 URL
    用户可见提示:
      - 请输入 OpenList 的 URL
      - 地址格式不正确时，无法建立连接
    用户应对动作:
      - 改为填写完整地址
      - 检查是否遗漏了协议头或地址主体
    可前往页面:
      - 网盘音乐管理区
  - 场景名称: 根目录未填写
    触发条件: 配置网盘连接时没有填写根目录
    用户可见提示:
      - 请输入 OpenList 的根目录
    用户应对动作:
      - 填写要展示的根目录路径
    可前往页面:
      - 网盘音乐管理区
  - 场景名称: 账号或密码未填写
    触发条件: 保存网盘连接时，没有填写账号或密码
    用户可见提示:
      - 请输入账号
      - 请输入密码
    用户应对动作:
      - 填写正确的账号和密码后重新保存
    可前往页面:
      - 网盘音乐管理区
  - 场景名称: 显示条数不是数字
    触发条件: 在显示条数字段中输入了非数字内容
    用户可见提示:
      - 请输入显示的条数
    用户应对动作:
      - 改为填写数字
      - 建议填写大于等于 1 的整数
    可前往页面:
      - 网盘音乐管理区

检索关键词:
  - WebDAV
  - 网盘音乐
  - OpenList
  - 直连模式
  - 本地挂载
