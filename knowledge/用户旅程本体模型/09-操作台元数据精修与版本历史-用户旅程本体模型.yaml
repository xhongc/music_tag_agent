旅程对象:
  名称: 操作台元数据精修与版本历史使用指引
  说明: 帮助用户逐首编辑歌曲信息，并查看与恢复历史版本

页面对象:
  - 操作台
  - 元数据详情面板
  - 歌词时间轴编辑器
  - 资源详情面板
  - 元数据版本历史面板

表单对象:
  元数据编辑表单:
    - 字段名: 标题
      是否必填: 必填
      输入类型: 文本
      格式要求:
        - 标题不能为空
      错误提示:
        - 标题不能为空
    - 字段名: 艺术家
      是否必填: 选填
      输入类型: 文本
      格式要求:
        - 可填写一个或多个艺术家名称
      错误提示:
        - 无
    - 字段名: 专辑
      是否必填: 选填
      输入类型: 文本
      格式要求:
        - 建议填写歌曲所属专辑名称
      错误提示:
        - 无
    - 字段名: 专辑艺术家
      是否必填: 选填
      输入类型: 文本
      格式要求:
        - 可填写专辑维度的主艺术家名称
      错误提示:
        - 无
    - 字段名: 年份
      是否必填: 选填
      输入类型: 数字
      格式要求:
        - 建议填写数字年份
      错误提示:
        - 年份格式不正确时，可能无法正常保存
    - 字段名: 风格
      是否必填: 选填
      输入类型: 文本
      格式要求:
        - 可填写一个或多个风格名称
      错误提示:
        - 无
    - 字段名: 语言
      是否必填: 选填
      输入类型: 文本
      格式要求:
        - 可填写歌曲语言或语种说明
      错误提示:
        - 无
    - 字段名: 歌词
      是否必填: 条件必填
      输入类型: 长文本
      格式要求:
        - 在执行歌词保存时必须填写
      错误提示:
        - 歌词不能为空
    - 字段名: 专辑封面
      是否必填: 选填
      输入类型: 图片
      格式要求:
        - 仅支持 JPG、PNG、GIF
        - 图片大小不超过 5MB
      错误提示:
        - 图片格式不支持时，无法上传封面
        - 图片过大时，无法上传封面
    - 字段名: 文件名
      是否必填: 选填
      输入类型: 文本
      格式要求:
        - 如需重命名，可填写新的文件名
      错误提示:
        - 文件名不符合系统要求时，可能无法完成保存

操作步骤对象:
  - 步骤名称: 打开元数据详情
    用户动作: 在操作台中选择歌曲并打开元数据详情
    系统反馈: 显示当前歌曲的完整标签信息
    后续动作: 编辑需要修正的字段

  - 步骤名称: 修改基础信息
    用户动作: 编辑标题、艺术家、专辑、年份、风格等内容
    填写项:
      - 标题
      - 艺术家
      - 专辑
      - 专辑艺术家
      - 年份
      - 风格
      - 语言
      - 文件名
    系统反馈: 待保存内容在面板中实时更新
    后续动作: 保存信息

  - 步骤名称: 编辑歌词与时间轴
    用户动作: 修改歌词，或打开歌词时间轴编辑器微调时间标记
    填写项:
      - 歌词
    系统反馈: 可进行翻译、格式化、时间轴微调和歌词导出
    后续动作: 保存歌词结果

  - 步骤名称: 更换专辑封面
    用户动作: 选择封面、从列表挑选封面、导出图片或从同目录导入封面
    填写项:
      - 专辑封面
    系统反馈: 显示封面预览与已选结果
    后续动作: 保存信息

  - 步骤名称: 查看版本历史
    用户动作: 打开版本历史入口
    系统反馈: 展示修改前后差异与历史记录
    后续动作: 查看某次变更或恢复历史版本

反馈对象:
  - 保存信息
  - 封面已选择
  - 元数据版本历史
  - 导出成功
  - 修改成功

结果对象:
  - 已更新的元数据
  - 已保存的歌词与封面
  - 元数据历史版本
  - 恢复后的版本结果

错误场景对象:
  - 场景名称: 标题为空
    触发条件: 保存歌曲基础信息时，没有填写标题
    用户可见提示:
      - 标题不能为空
    用户应对动作:
      - 先填写歌曲标题，再重新保存
    可前往页面:
      - 元数据详情面板
  - 场景名称: 年份格式不正确
    触发条件: 在年份字段中填写了非数字内容
    用户可见提示:
      - 年份格式不正确时，可能无法正常保存
    用户应对动作:
      - 改为填写数字年份
    可前往页面:
      - 元数据详情面板
  - 场景名称: 歌词为空
    触发条件: 执行歌词保存时，歌词内容为空
    用户可见提示:
      - 歌词不能为空
    用户应对动作:
      - 先补充歌词内容，再重新保存
    可前往页面:
      - 歌词时间轴编辑器
  - 场景名称: 专辑封面格式不支持
    触发条件: 上传了 JPG、PNG、GIF 之外的封面图片
    用户可见提示:
      - 图片格式不支持时，无法上传封面
    用户应对动作:
      - 改为上传 JPG、PNG 或 GIF 图片
    可前往页面:
      - 元数据详情面板
  - 场景名称: 专辑封面超过大小限制
    触发条件: 上传的封面图片大于 5MB
    用户可见提示:
      - 图片过大时，无法上传封面
    用户应对动作:
      - 压缩图片后重新上传
      - 将图片大小控制在 5MB 以内
    可前往页面:
      - 元数据详情面板

检索关键词:
  - 元数据详情
  - 编辑标签
  - 歌词时间轴
  - 版本历史
  - 封面替换
