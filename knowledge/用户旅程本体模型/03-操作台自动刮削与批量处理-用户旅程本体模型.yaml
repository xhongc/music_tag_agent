旅程对象:
  名称: 操作台自动刮削与批量处理使用指引
  说明: 帮助用户批量补全歌曲标签、封面、歌词与其他信息

页面对象:
  - 操作台
  - 文件列表区域
  - 批量处理面板
  - 自动刮削配置面板
  - 操作记录页

表单对象:
  自动刮削表单:
    - 字段名: 标签来源
      是否必填: 必填
      输入类型: 多选
      格式要求:
        - 至少选择一个可用标签来源
        - 建议优先选择稳定可用的来源
      错误提示:
        - 未选择标签来源时，系统无法执行自动刮削
    - 字段名: 需要补全的内容
      是否必填: 必填
      输入类型: 多选
      格式要求:
        - 至少勾选一项需要补全的内容，如标题、艺术家、专辑、封面、歌词、年份
      错误提示:
        - 未勾选补全内容时，系统无法明确处理目标
    - 字段名: 是否将同目录视为同一专辑
      是否必填: 选填
      输入类型: 开关
      格式要求:
        - 开启后会将同一目录下的歌曲按同一专辑处理
      错误提示:
        - 无
    - 字段名: 是否保留原有内容
      是否必填: 选填
      输入类型: 开关
      格式要求:
        - 开启后会尽量跳过已存在的标签内容
      错误提示:
        - 无

操作步骤对象:
  - 步骤名称: 勾选待处理内容
    用户动作: 在操作台中勾选歌曲、文件夹或一组批量对象
    系统反馈: 已勾选内容进入批量处理范围
    后续动作: 打开自动刮削

  - 步骤名称: 打开自动刮削配置
    用户动作: 点击“自动刮削”
    系统反馈: 显示自动刮削配置面板
    后续动作: 填写处理规则

  - 步骤名称: 选择标签来源
    用户动作: 选择一个或多个可用来源
    填写项:
      - 标签来源
    系统反馈: 系统按所选来源进行匹配
    后续动作: 选择补全内容

  - 步骤名称: 选择需要补全的内容
    用户动作: 勾选标题、艺术家、专辑、专辑封面、歌词、年份等内容
    填写项:
      - 需要补全的内容
      - 是否将同目录视为同一专辑
      - 是否保留原有内容
    系统反馈: 显示即将执行的规则范围
    后续动作: 确认执行

  - 步骤名称: 提交自动刮削任务
    用户动作: 点击确认
    系统反馈:
      - 未勾选对象时提示“请先选择文件或文件夹”
      - 创建成功时提示“创建成功，任务正在处理中”
      - 创建失败时提示“创建失败，请检查配置”
    后续动作: 前往操作记录页查看处理结果

反馈对象:
  - 请先选择文件或文件夹
  - 创建成功，任务正在处理中
  - 创建失败，请检查配置
  - 可前往操作记录页查看结果

结果对象:
  - 自动刮削任务
  - 批量处理结果
  - 已补全的标签信息
  - 失败原因

错误场景对象:
  - 场景名称: 未选择标签来源
    触发条件: 打开自动刮削后，没有选择任何标签来源就尝试提交
    用户可见提示:
      - 未选择标签来源时，系统无法执行自动刮削
    用户应对动作:
      - 至少选择一个可用标签来源后再提交
    可前往页面:
      - 自动刮削配置面板
  - 场景名称: 未勾选补全内容
    触发条件: 没有勾选任何补全目标就尝试执行任务
    用户可见提示:
      - 未勾选补全内容时，系统无法明确处理目标
    用户应对动作:
      - 至少勾选一项需要补全的内容
    可前往页面:
      - 自动刮削配置面板
  - 场景名称: 未勾选待处理对象
    触发条件: 没有选中文件或文件夹就直接提交自动刮削
    用户可见提示:
      - 请先选择文件或文件夹
    用户应对动作:
      - 回到文件列表勾选需要处理的对象
    可前往页面:
      - 文件列表区域
  - 场景名称: 任务创建失败
    触发条件: 自动刮削配置不完整或当前处理条件不满足要求
    用户可见提示:
      - 创建失败，请检查配置
    用户应对动作:
      - 检查标签来源、补全内容和勾选对象是否完整
      - 修正后重新创建任务
    可前往页面:
      - 自动刮削配置面板

检索关键词:
  - 自动刮削
  - 批量处理
  - 标签来源
  - 补全标签
  - 歌词
  - 封面
