旅程对象:
  名称: 播放设备切换与多端同播使用指引
  说明: 帮助用户切换输出设备，并创建多人同步收听房间

页面对象:
  - 正在播放页
  - 播放设备选择页
  - 小爱播放页
  - 多端同播页

表单对象:
  同播房间表单:
    - 字段名: 房间号
      是否必填: 条件必填
      输入类型: 文本
      格式要求:
        - 加入已有房间时必须填写
        - 仅支持 4 到 32 位字母或数字
      错误提示:
        - 房间号仅支持4-32位字母或数字
    - 字段名: 聊天消息
      是否必填: 条件必填
      输入类型: 文本
      格式要求:
        - 发送聊天时必须填写内容
        - 不可为空
      错误提示:
        - 消息不能为空

操作步骤对象:
  - 步骤名称: 选择播放设备
    用户动作: 打开播放设备选择页
    系统反馈: 显示本地播放、DLNA播放、小爱音箱播放等设备入口
    后续动作: 切换到目标设备

  - 步骤名称: 切换到目标播放方式
    用户动作: 选择目标设备
    系统反馈: 切换到对应播放页面并更新播放队列
    后续动作: 开始播放或管理队列

  - 步骤名称: 创建或加入同播房间
    用户动作: 在多端同播页创建房间或输入房间号加入
    填写项:
      - 房间号
    系统反馈: 显示房间成员、播放列表、滚动歌词和聊天区
    后续动作: 同步控制播放

  - 步骤名称: 在房间内互动
    用户动作: 发送消息、查看成员、同步收听
    填写项:
      - 聊天消息
    系统反馈: 实时同步聊天与播放状态
    后续动作: 离开房间或继续同播

反馈对象:
  - 选择播放设备
  - 已切换到播放页面
  - 创建房间
  - 加入房间
  - 房主连接中

结果对象:
  - 当前播放设备
  - 同播房间
  - 房间成员列表
  - 同步播放状态

错误场景对象:
  - 场景名称: 房间号格式不正确
    触发条件: 加入同播房间时，输入的房间号不符合规则
    用户可见提示:
      - 房间号仅支持4-32位字母或数字
    用户应对动作:
      - 改为输入 4 到 32 位字母或数字组成的房间号
      - 去掉空格、符号或过长内容
    可前往页面:
      - 多端同播页
  - 场景名称: 聊天消息为空
    触发条件: 在房间内点击发送消息，但没有输入任何内容
    用户可见提示:
      - 消息不能为空
    用户应对动作:
      - 先输入消息内容，再重新发送
    可前往页面:
      - 多端同播页
  - 场景名称: 房主连接中
    触发条件: 房间已经建立，但房主设备尚未稳定连接
    用户可见提示:
      - 房主连接中
    用户应对动作:
      - 稍等片刻后重试
      - 如长时间无响应，可退出后重新加入房间
    可前往页面:
      - 多端同播页

检索关键词:
  - 播放设备
  - 切换设备
  - 多端同播
  - 房间
  - 小爱播放
